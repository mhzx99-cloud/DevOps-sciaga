<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux, DevOps, SQL — Ściąga Rekrutacyjna</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161b27;
    --bg3: #1e2535;
    --bg4: #252d3f;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --text: #e8edf5;
    --muted: #8492a6;
    --muted2: #6b7a8d;
    --accent: #3b82f6;
    --accent2: #1d4ed8;
    --green: #10b981;
    --amber: #f59e0b;
    --red: #ef4444;
    --purple: #8b5cf6;
    --teal: #14b8a6;
    --pink: #ec4899;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  /* HEADER */
  header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 100; }
  .logo { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--green); }
  .subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .header-stats { margin-left: auto; text-align: right; }
  .header-stats .num { font-family: var(--mono); font-size: 1.2rem; font-weight: 700; color: var(--text); }
  .header-stats .lbl { font-size: 0.7rem; color: var(--muted2); }

  /* CONTROLS */
  .controls { padding: 1.25rem 2rem; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
  .search-wrap { position: relative; width: 100%; display: flex; gap: 6px; }
  .search-inner { position: relative; flex: 1; }
  .search-inner svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  input[type=text] { width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: var(--sans); font-size: 0.875rem; padding: 8px 10px 8px 34px; border-radius: 8px; outline: none; transition: border-color .2s; }
  input[type=text]:focus { border-color: var(--accent); }
  input[type=text]::placeholder { color: var(--muted2); }
  .ai-btn { background: linear-gradient(135deg, #3b82f6, #8b5cf6); border: none; color: #fff; font-size: 0.75rem; font-family: var(--sans); padding: 0 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 5px; transition: opacity .15s; height: 36px; }
  .ai-btn:hover { opacity: 0.85; }
  .ai-btn:disabled { opacity: 0.5; cursor: default; }
  /* SEARCH PANEL */
  #ai-panel { display: none; background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 2rem 1.25rem; }
  #ai-panel.open { display: block; }
  .ai-result { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-top: 10px; font-size: 0.82rem; line-height: 1.65; color: var(--text); position: relative; }
  .ai-label { font-size: 0.65rem; font-family: var(--mono); color: var(--purple); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
  .ai-spinner { width: 10px; height: 10px; border: 2px solid rgba(139,92,246,0.3); border-top-color: var(--purple); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ai-close { position: absolute; top: 10px; right: 12px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 5px; border-radius: 4px; }
  .ai-close:hover { color: var(--text); background: var(--bg4); }
  /* Smart search result cards */
  .sr-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.8rem; color: var(--muted); position: relative; }
  .sr-header strong { color: var(--text); }
  .sr-synonyms { font-size: 0.7rem; color: var(--muted); margin-bottom: 10px; }
  .sr-synonyms code { font-family: var(--mono); font-size: 0.68rem; background: var(--bg4); color: #93bbfd; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); margin: 0 2px; }
  .sr-card { background: var(--bg4); border: 1px solid var(--border); border-left: 3px solid var(--acc, #3b82f6); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .sr-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sr-num { font-size: 0.65rem; font-family: var(--mono); background: var(--acc,#3b82f6); color: #fff; border-radius: 50%; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sr-sec { font-size: 0.7rem; font-family: var(--mono); color: var(--muted); }
  .sr-cat { font-size: 0.65rem; font-family: var(--mono); padding: 1px 7px; border-radius: 10px; border: 1px solid; }
  .sr-q { font-size: 0.82rem; font-weight: 500; color: var(--text); margin-bottom: 4px; line-height: 1.4; }
  .sr-a { font-size: 0.76rem; color: var(--muted2); line-height: 1.5; }
  .sr-card mark { background: rgba(251,191,36,0.25); color: var(--text); border-radius: 2px; padding: 0 1px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 0.7rem; font-family: var(--mono); padding: 4px 10px; border-radius: 20px; cursor: pointer; border: 1px solid; transition: all .15s; user-select: none; white-space: nowrap; }
  .btn-clear { font-size: 0.7rem; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; font-family: var(--sans); transition: all .15s; }
  .btn-clear:hover { border-color: var(--border2); color: var(--text); }

  /* LAYOUT */
  main { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 120px); }

  /* SIDEBAR */
  aside { background: var(--bg2); border-right: 1px solid var(--border); padding: 1rem; overflow-y: auto; position: sticky; top: 113px; height: calc(100vh - 113px); }
  .side-label { font-size: 0.65rem; font-family: var(--mono); color: var(--muted2); text-transform: uppercase; letter-spacing: 1px; padding: 0 8px; margin: 8px 0 4px; }
  .side-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; transition: background .15s; font-size: 0.8rem; color: var(--muted); }
  .side-item:hover { background: var(--bg3); color: var(--text); }
  .side-item.active { background: var(--bg4); color: var(--text); }
  .side-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .side-count { margin-left: auto; font-family: var(--mono); font-size: 0.65rem; color: var(--muted2); }

  /* CONTENT */
  .content { padding: 1.5rem 2rem; }
  .result-bar { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); margin-bottom: 1rem; }
  .no-results { text-align: center; color: var(--muted); padding: 4rem; font-size: 0.9rem; }

  /* SECTIONS */
  .section { margin-bottom: 1rem; }
  .section-header { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 10px; user-select: none; transition: border-color .15s; }
  .section-header:hover { border-color: var(--border2); }
  .section-header.open { border-radius: 10px 10px 0 0; border-bottom-color: transparent; }
  .sec-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sec-title { font-size: 0.9rem; font-weight: 600; flex: 1; }
  .sec-cat { font-size: 0.65rem; font-family: var(--mono); padding: 2px 8px; border-radius: 10px; border: 1px solid; }
  .sec-qcount { font-family: var(--mono); font-size: 0.7rem; color: var(--muted2); }
  .chevron { color: var(--muted); font-size: 12px; transition: transform .2s; }
  .section-header.open .chevron { transform: rotate(180deg); }

  .section-body { display: none; border: 1px solid var(--border); border-top: none; border-radius: 0 0 10px 10px; overflow: hidden; }
  .section-body.open { display: block; }

  .qa-item { border-bottom: 1px solid var(--border); padding: 14px 16px; }
  .qa-item:last-child { border-bottom: none; }
  .qa-item:hover { background: rgba(255,255,255,0.02); }
  .q-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; cursor: pointer; }
  .q-badge { font-size: 0.6rem; font-family: var(--mono); padding: 2px 6px; border-radius: 4px; background: rgba(59,130,246,0.15); color: #93bbfd; border: 1px solid rgba(59,130,246,0.25); flex-shrink: 0; margin-top: 2px; }
  .q-text { font-size: 0.85rem; font-weight: 500; color: var(--text); line-height: 1.5; }
  .a-row { display: none; padding-left: 0; }
  .a-row.open { display: block; }
  .a-text { font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
  .a-text code { font-family: var(--mono); font-size: 0.75rem; background: var(--bg4); color: #93bbfd; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--border); }
  .tip-badge { display: inline-block; font-size: 0.65rem; font-family: var(--mono); padding: 1px 6px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
  .tip-cmd { background: rgba(20,184,166,0.15); color: #5eead4; border: 1px solid rgba(20,184,166,0.25); }
  .tip-warn { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(245,158,11,0.25); }
  .tip-info { background: rgba(139,92,246,0.15); color: #c4b5fd; border: 1px solid rgba(139,92,246,0.25); }

  /* PROGRESS */
  .progress-bar { height: 2px; background: var(--bg4); border-radius: 2px; margin-top: 4px; }
  .progress-fill { height: 100%; border-radius: 2px; transition: width .3s; }

  /* FOOTER */
  footer { border-top: 1px solid var(--border); padding: 1rem 2rem; text-align: center; font-size: 0.7rem; color: var(--muted2); font-family: var(--mono); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

  @media (max-width: 768px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    header { padding: 1rem; }
    .controls { padding: 1rem; }
    .content { padding: 1rem; }
  }
</style>
</head>

<script>
const CATS = {
  "System":     { color: "#10b981", bg: "rgba(16,185,129,0.12)", border: "rgba(16,185,129,0.3)" },
  "Security":   { color: "#ef4444", bg: "rgba(239,68,68,0.12)",  border: "rgba(239,68,68,0.3)" },
  "Infra/IaC":  { color: "#3b82f6", bg: "rgba(59,130,246,0.12)", border: "rgba(59,130,246,0.3)" },
  "Containers": { color: "#8b5cf6", bg: "rgba(139,92,246,0.12)", border: "rgba(139,92,246,0.3)" },
  "Cloud":      { color: "#f59e0b", bg: "rgba(245,158,11,0.12)", border: "rgba(245,158,11,0.3)" },
  "Monitoring": { color: "#14b8a6", bg: "rgba(20,184,166,0.12)", border: "rgba(20,184,166,0.3)" },
  "Networking": { color: "#ec4899", bg: "rgba(236,72,153,0.12)", border: "rgba(236,72,153,0.3)" },
  "Storage/HA": { color: "#a78bfa", bg: "rgba(167,139,250,0.12)","border": "rgba(167,139,250,0.3)" },
  "CI/CD":      { color: "#f97316", bg: "rgba(249,115,22,0.12)",  border: "rgba(249,115,22,0.3)" },
  "Database":   { color: "#06b6d4", bg: "rgba(6,182,212,0.12)",   border: "rgba(6,182,212,0.3)" }
};

const DATA = [
  { title: "Linux / RHEL / CentOS — Mid/Senior", cat: "System", qa: [
    { q: "Jak działa proces bootowania RHEL od BIOS/UEFI do loginu?", a: "<span class='tip-badge tip-info'>INFO</span> BIOS/UEFI → GRUB2 (<code>/boot/grub2/grub.cfg</code>) → kernel + initramfs (dracut) → kernel init sprzętu → PID 1 (systemd) → default.target → getty/login. Debuguj: <code>systemd-analyze blame</code>, <code>systemd-analyze critical-chain</code>, <code>journalctl -b</code>. Czas bootowania: <code>systemd-analyze time</code>." },
    { q: "Jak tworzyć własne systemd unit files (service, timer, socket)?", a: "<code>/etc/systemd/system/myapp.service</code>: <code>[Unit] Description=MyApp After=network.target\n[Service] Type=simple ExecStart=/opt/myapp/run.sh Restart=on-failure RestartSec=5 User=myapp EnvironmentFile=/etc/myapp.env\n[Install] WantedBy=multi-user.target</code>. Timer: <code>[Timer] OnCalendar=*-*-* 02:00:00 Persistent=true</code>. Socket activation: <code>.socket</code> unit. <code>systemctl daemon-reload</code> po zmianach." },
    { q: "Co to systemd Type= i kiedy używać każdego?", a: "<code>simple</code>: domyślny, ExecStart to główny proces. <code>forking</code>: tradycyjny daemon (fork + exit parenta — wymaga PIDFile). <code>oneshot</code>: krótkie zadanie, systemd czeka na zakończenie. <code>notify</code>: serwis sygnalizuje gotowość przez <code>sd_notify()</code>. <code>dbus</code>: gotowość przez D-Bus. <code>idle</code>: czeka na zakończenie innych jobów. Najczęściej: simple lub notify." },
    { q: "Jak działa dracut i initramfs — kiedy przebudować?", a: "initramfs: tymczasowy rootfs ładowany przed montowaniem /. Zawiera moduły, udev, LVM, LUKS, multipath. Przebuduj po: zmianie sterowników, dodaniu LUKS/LVM. <code>dracut -f /boot/initramfs-$(uname -r).img $(uname -r)</code>. Debug initramfs: boot z <code>rd.break</code> → shell przed montowaniem /sysroot. <code>lsinitrd</code> — zawartość obrazu." },
    { q: "Co to DNF modules i application streams (RHEL 8+)?", a: "<span class='tip-badge tip-info'>INFO</span> AppStreams: równoległe wersje pakietów (Python 3.9 i 3.11 jednocześnie). <code>dnf module list</code>. Włącz: <code>dnf module enable python39:3.9</code>. Zainstaluj profil: <code>dnf module install nodejs:18/development</code>. Reset: <code>dnf module reset python39</code>. Moduły zastąpiły Software Collections (SCL) z RHEL 7." },
    { q: "Jak działa GRUB2 i jak naprawić uszkodzony bootloader?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Config: <code>/etc/default/grub</code> + <code>grub2-mkconfig -o /boot/grub2/grub.cfg</code>. Naprawa z live CD: <code>mount /dev/sda2 /mnt && for d in dev proc sys run; do mount --bind /$d /mnt/$d; done && chroot /mnt && grub2-install /dev/sda && grub2-mkconfig -o /boot/grub2/grub.cfg</code>. UEFI: target <code>x86_64-efi</code>, output <code>/boot/efi/EFI/redhat/grub.cfg</code>." },
    { q: "Co to cgroups v2 i jak zarządzać zasobami procesów?", a: "cgroups v2: unified hierarchy, jeden mount <code>/sys/fs/cgroup</code>. <code>systemctl set-property nginx.service CPUQuota=50% MemoryMax=512M IOWriteBandwidthMax='/dev/sda 10M'</code>. Sprawdź: <code>systemd-cgls</code>, <code>systemd-cgtop</code>. <code>cat /sys/fs/cgroup/system.slice/nginx.service/memory.current</code>. RHEL 9: cgroups v2 domyślny, RHEL 8: v1 domyślny." },
    { q: "Jak działa Linux namespace isolation?", a: "7 typów: <code>pid</code> (izolacja procesów), <code>net</code> (sieć, routing, iptables), <code>mnt</code> (mounty, pivotroot), <code>uts</code> (hostname/domainname), <code>ipc</code> (semafory, kolejki), <code>user</code> (UID/GID mapping — rootless), <code>cgroup</code> (cgroup root). <code>unshare --pid --fork --mount-proc bash</code>. <code>lsns -p PID</code>. <code>nsenter -t PID --net ip addr</code>." },
    { q: "Jak zarządzać kernel modules — ładowanie, blacklistowanie, parametry?", a: "<span class='tip-badge tip-cmd'>CMD</span> Lista: <code>lsmod</code>. Info: <code>modinfo -p module</code> (parametry). Załaduj z parametrem: <code>modprobe module param=value</code>. Trwałe: <code>/etc/modules-load.d/</code> i <code>/etc/modprobe.d/options.conf: options module param=value</code>. Blacklist: <code>/etc/modprobe.d/blacklist.conf</code>. Sprawdź używane parametry: <code>systool -v -m module</code>." },
    { q: "Jak działa journald — konfiguracja, persistent storage, forwarding?", a: "<code>/etc/systemd/journald.conf</code>: <code>Storage=persistent</code> (domyślnie auto — persistent jeśli <code>/var/log/journal</code> istnieje). <code>SystemMaxUse=2G</code>, <code>SystemKeepFree=1G</code>. Forwarding: <code>ForwardToSyslog=yes</code>, <code>ForwardToKMsg=yes</code>. Export: <code>journalctl -o export | gzip > logs.gz</code>. Remote: <code>systemd-journal-remote</code>." },
    { q: "Jak efektywnie przeszukiwać journald?", a: "<code>journalctl -u nginx -f</code>. <code>-b -1</code> (poprzedni boot). <code>--since '1 hour ago'</code>. <code>-p err..emerg</code>. <code>-o json-pretty</code>. <code>_UID=1000</code> (per użytkownik). <code>_SYSTEMD_UNIT=nginx.service + PRIORITY=3</code> (AND). <code>journalctl -k</code> (kernel). <code>--disk-usage</code>. Vacuum: <code>journalctl --vacuum-time=7d</code>." },
    { q: "Co to tuned i jak tworzyć własne profile?", a: "Daemon zarządzający profilami wydajności. Profile: <code>throughput-performance</code>, <code>latency-performance</code>, <code>virtual-guest</code>, <code>oracle</code>, <code>mssql</code>. Własny profil: <code>/etc/tuned/myprofil/tuned.conf: [main] include=throughput-performance\n[sysctl] vm.swappiness=5\n[disk] elevator=deadline</code>. <code>tuned-adm recommend</code> sugeruje profil. <code>tuned-adm active</code>." },
    { q: "Jak debugować problem z zawieszonym procesem (state D)?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>D</code> state = uninterruptible sleep (czeka na I/O). <code>cat /proc/PID/wchan</code> — gdzie czeka. <code>cat /proc/PID/stack</code> — kernel stack. <code>strace -p PID</code> — syscalle. <code>lsof -p PID</code> — otwarte zasoby. Jeśli I/O: <code>iostat -xz 1</code>, sprawdź storage. NFS hang: <code>nfsiostat</code>, <code>rpcinfo</code>. Często: hung NFS mount lub storage timeout." },
    { q: "Co to NUMA i jak wpływa na wydajność?", a: "Wieloprocesorowe systemy — dostęp do lokalnej pamięci CPU szybszy niż zdalnej. <code>numactl --hardware</code>. <code>numastat -p PID</code> — local vs remote hits. <code>numastat -m</code> — per-node memory. Problemy: high numa_miss = procesy alokują na odległym node. Fix: <code>numactl --cpunodebind=0 --membind=0 ./app</code>. <code>numad</code>: automatyczne balansowanie. Kernel: <code>numa_balancing=1</code>." },
    { q: "Jak zarządzać limitami (ulimit, limits.conf, systemd)?", a: "Sesja: <code>ulimit -n 65535</code>. Trwałe PAM: <code>/etc/security/limits.d/90-custom.conf: * soft nofile 65535\n* hard nofile 65535</code>. Systemd service: <code>LimitNOFILE=65535 LimitNPROC=4096 LimitCORE=infinity</code>. Sprawdź proces: <code>cat /proc/PID/limits</code>. System max: <code>sysctl fs.file-max</code>. <code>fs.nr_open</code> to absolutne maksimum per proces." },
    { q: "Jak działa OOM Killer — diagnostyka i ochrona procesów?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Kernel wybiera ofiarę po <code>oom_score</code> (wyższy = bardziej narażony). Sprawdź: <code>cat /proc/PID/oom_score</code>. Chroń: <code>echo -1000 > /proc/PID/oom_score_adj</code>. Systemd: <code>OOMScoreAdjust=-500</code>. Diagnostyka: <code>dmesg | grep -i 'oom\|killed'</code>. Overcommit policy: <code>vm.overcommit_memory=2</code> zapobiega nadmiernemu allokowaniu." },
    { q: "Co to RHEL Subscription Manager i Red Hat Satellite?", a: "<span class='tip-badge tip-cmd'>CMD</span> Rejestracja: <code>subscription-manager register</code>. Attach: <code>subscription-manager attach --auto</code>. Enable repo: <code>subscription-manager repos --enable=rhel-9-appstream-rpms</code>. Satellite: on-premise proxy dla subskrypcji + patch management + provisioning. <code>subscription-manager config --server.hostname=satellite.firma.pl</code>. Insights: <code>insights-client --register</code>." },
    { q: "Jak działają SELinux boolean i audit2allow?", a: "Boolean zmienia politykę bez rekompilacji. <code>getsebool -a | grep httpd</code>. <code>setsebool -P httpd_can_network_connect on</code>. Diagnoza: <code>ausearch -m avc -ts recent | audit2why</code>. Generuj moduł: <code>ausearch -m avc | audit2allow -M mypol && semodule -i mypol.pp</code>. <code>sealert -a /var/log/audit/audit.log</code>. Nigdy nie wyłączaj SELinux — najpierw diagnozuj." },
    { q: "Jak działają inode i filesystem — co się dzieje przy df vs du?", a: "<code>df -h</code> pokazuje zajętość bloków. <code>du -sh /dir</code> sumuje pliki. Rozbieżność: usunięte pliki trzymane przez otwarte file descriptory (<code>lsof | grep deleted</code>). Inodes: <code>df -i</code> — można zapełnić inody bez zapełnienia bloków (dużo małych plików). XFS: dynamiczne inody. <code>stat plik</code>: inode, bloki, timestamps (atime/mtime/ctime)." },
    { q: "Co to extended attributes (xattr) i jak używać?", a: "Metadane poza standardowymi atrybutami pliku. Namespace: user, system, security (SELinux), trusted. <code>setfattr -n user.comment -v 'backup done' plik</code>. <code>getfattr -d plik</code>. Pojemność i immutable: <code>chattr +i plik</code> (immutable — nawet root nie może usunąć). <code>chattr +a plik</code> (append-only dla logów). <code>lsattr plik</code>." },
    { q: "Jak zarządzać siecią przez NetworkManager (nmcli) zaawansowane?", a: "<span class='tip-badge tip-cmd'>CMD</span> Bond: <code>nmcli con add type bond con-name bond0 bond.options 'mode=802.3ad,miimon=100'</code>. Bridge: <code>nmcli con add type bridge con-name br0</code>. VLAN: <code>nmcli con add type vlan con-name vlan10 dev eth0 id 10</code>. IPv6: <code>nmcli con mod eth0 ipv6.method manual ipv6.addresses 'fd00::1/64'</code>. DNS per connection: <code>ipv4.dns-search 'firma.pl'</code>." },
    { q: "Co to ip routing i jak zarządzać tablicami routingu?", a: "<code>ip route show table main</code>. Dodaj: <code>ip route add 10.0.0.0/8 via 192.168.1.1 dev eth0</code>. Trwałe: <code>nmcli con mod eth0 +ipv4.routes '10.0.0.0/8 192.168.1.1'</code>. Policy routing (multi-homed): <code>ip rule add from 192.168.2.0/24 table 200</code>. <code>ip route add default via gw table 200</code>. Tablice: <code>/etc/iproute2/rt_tables</code>." },
    { q: "Jak działa tcpdump — filtrowanie i analiza?", a: "<code>tcpdump -i eth0 -n -w /tmp/cap.pcap 'host 10.0.0.1 and port 443'</code>. Odczyt: <code>tcpdump -r cap.pcap -A</code>. BPF (Berkeley Packet Filter) filtry: <code>tcp[tcpflags] & tcp-syn != 0</code> (tylko SYN). <code>not port 22</code>. Verbose: <code>-vvv</code>. Wireshark: otwórz pcap. <code>tcpdump -i any</code> wszystkie interfejsy. Użyteczne: <code>tcpdump -l | tee /tmp/log</code>." },
    { q: "Jak zarządzać patchowaniem systemu w skali (wiele serwerów)?", a: "Red Hat Satellite / Foreman: centralne zarządzanie patchami, harmonogram, Content Views (snapshot repozytoriów). Ansible: <code>dnf: name='*' state=latest</code> z odpowiednim harmonogramem. RHEL Systems Insights: automatyczna detekcja CVE. Strategia: patch w dev → staging → prod. Maintenance windows. <code>needs-restarting -r</code> czy reboot wymagany po patchu." },
    { q: "Co to kdump i jak skonfigurować crash dump?", a: "kdump: mechanizm zrzutu pamięci przy kernel panic. Instalacja: <code>dnf install kexec-tools && systemctl enable kdump</code>. Konfiguracja: <code>/etc/kdump.conf: path /var/crash\ncore_collector makedumpfile -l --message-level 1 -d 31</code>. Zarezerwuj pamięć: <code>/etc/default/grub: crashkernel=auto</code>. Analiza: <code>crash /boot/vmlinux-$(uname -r) /var/crash/*/vmcore</code>." },
    { q: "Co to systemd-resolved i jak debugować DNS?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>resolvectl status</code> — aktualny DNS per interfejs. <code>resolvectl query example.com</code>. Cache: <code>resolvectl flush-caches</code>. Stats: <code>resolvectl statistics</code>. LLMNR, mDNS: wyłącz jeśli zbędne (<code>LLMNR=no</code> w <code>/etc/systemd/resolved.conf</code>). <code>/etc/resolv.conf</code>: symlink do <code>/run/systemd/resolve/stub-resolv.conf</code>. Override DNS: <code>nmcli con mod eth0 ipv4.dns 1.1.1.1</code>." },
    { q: "Jak działa PAM — pisanie własnych polityk?", a: "Stack PAM: auth (autentykacja), account (warunki konta), password (zmiana hasła), session (środowisko). <code>/etc/pam.d/sshd</code>. Reguła: <code>required/requisite/sufficient/optional modul args</code>. Przykład MFA: <code>auth required pam_google_authenticator.so</code>. <code>pam_faillock</code>: <code>auth required pam_faillock.so preauth deny=5 unlock_time=600</code>. Test: <code>pamtester sshd user authenticate</code>." },
    { q: "Co to coredump i jak analizować crash aplikacji?", a: "Coredump: zrzut pamięci procesu przy SIGSEGV/crash. Systemd: przechowuje w <code>/var/lib/systemd/coredump/</code>. Lista: <code>coredumpctl list</code>. Analiza: <code>coredumpctl gdb PID</code>. <code>bt</code> w gdb = backtrace. Włącz: <code>ulimit -c unlimited</code> lub systemd <code>DefaultLimitCORE=infinity</code>. Pattern: <code>sysctl kernel.core_pattern='|/usr/lib/systemd/systemd-coredump %P %u %g %s %t %c %h'</code>." },
    { q: "Jak zarządzać time i NTP w RHEL?", a: "<code>timedatectl status</code>. Strefa: <code>timedatectl set-timezone Europe/Warsaw</code>. NTP: <code>timedatectl set-ntp true</code> (chrony domyślnie). <code>/etc/chrony.conf: server ntp.firma.pl iburst</code>. Wymusz sync: <code>chronyc makestep</code>. Status: <code>chronyc tracking</code>, <code>chronyc sources -v</code>. PTP (hardware timestamps): <code>ptp4l</code> dla nanosekund precyzji." },
    { q: "Co to multipath i jak skonfigurować?", a: "Multipath I/O: wiele ścieżek do tego samego storage (HA + load balancing). <code>dnf install device-mapper-multipath && mpathconf --enable</code>. <code>/etc/multipath.conf</code>: <code>defaults { polling_interval 10 }</code>. <code>multipathd -k'show paths'</code>. <code>multipath -ll</code>. Polityki: <code>failover</code>, <code>multibus</code> (round-robin), <code>group_by_prio</code>. WWN dla SAN: <code>cat /sys/class/fc_host/host*/port_name</code>." },
    { q: "Jak działa rsyslog i jak agregować logi centralnie?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>/etc/rsyslog.conf</code>: reguły <code>facility.severity action</code>. Forward UDP: <code>*.* @centrallog:514</code>. Forward TCP/TLS: <code>*.* @@centrallog:514</code>. Serwer centralny: <code>module(load='imudp') input(type='imudp' port='514')</code>. Template per host: <code>/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log</code>. Alternatywa: Fluentd/Fluent Bit dla K8s." },
    { q: "Co to udev i jak pisać własne reguły?", a: "Dynamiczny menedżer urządzeń. Reguły w <code>/etc/udev/rules.d/</code>. Przykład stała nazwa dysku: <code>SUBSYSTEM==\"block\", ATTRS{serial}==\"SN123\", SYMLINK+=\"data_disk\"</code>. Przykład uprawnienia USB: <code>SUBSYSTEM==\"usb\", ATTR{idVendor}==\"1234\", MODE=\"0660\", GROUP=\"plugdev\"</code>. Reload: <code>udevadm control --reload && udevadm trigger</code>. Debug: <code>udevadm monitor</code>." },
    { q: "Jak analizować wydajność I/O?", a: "<code>iostat -xz 1</code>: <code>%util</code> (nasycenie), <code>await</code> (latencja), <code>r/s w/s</code> (IOPS). <code>iotop -ao</code> per proces. <code>blktrace -d /dev/sda -o - | blkparse -i -</code>: szczegółowa analiza. <code>fio</code>: benchmarking. <code>ioping</code>: latencja. Sprawdź scheduler: <code>cat /sys/block/sda/queue/scheduler</code>. NVMe: <code>nvme smart-log /dev/nvme0</code>." },
    { q: "Co to btrfs i kiedy używać zamiast XFS/ext4?", a: "Btrfs: CoW filesystem, natywne snapshoty, RAID wbudowany, checksums, subvolumes, send/receive. Używaj gdy: snapshoty (<code>btrfs subvolume snapshot</code>), deduplikacja, self-healing. XFS: produkcja enterprise, duże pliki, dobra wydajność. ext4: stabilny, szeroka kompatybilność. RHEL 8+: XFS domyślny, Btrfs nie wspierany produkcyjnie (Fedora tak)." },
    { q: "Jak zarządzać rozszerzeniami XFS?", a: "<span class='tip-badge tip-cmd'>CMD</span> XFS nie wspiera shrink. Grow: <code>xfs_growfs /mountpoint</code> (po rozszerzeniu LV). Naprawa: <code>xfs_repair /dev/sdb1</code> (tylko unmounted). Quota: <code>mount -o uquota,gquota && xfs_quota -x -c 'limit -u bhard=10g jan /data'</code>. Dump/restore: <code>xfsdump</code>/<code>xfsrestore</code>. Defrag: <code>xfs_fsr</code>. Info: <code>xfs_info /mountpoint</code>." },
    { q: "Co to Linux Huge Pages — transparent vs explicit?", a: "Transparent Huge Pages (THP): kernel automatycznie łączy strony 4K w 2MB. Dla baz danych (Oracle, PostgreSQL, MySQL) często problem: <code>echo madvise > /sys/kernel/mm/transparent_hugepage/enabled</code>. Explicit hugepages: <code>vm.nr_hugepages=512</code> w sysctl, aplikacja musi jawnie używać. KVM gości: THP poprawia wydajność hiperwizora. <code>cat /proc/meminfo | grep Huge</code>." },
    { q: "Jak działa linux performance profiling z perf?", a: "<code>perf stat ./app</code> — hardware counters (IPC, cache misses). <code>perf record -g ./app && perf report</code> — CPU profiling z call graph. <code>perf top</code> — live. <code>perf trace -p PID</code> — syscall trace (szybszy niż strace). Flame graph: <code>perf script | stackcollapse-perf.pl | flamegraph.pl > out.svg</code>. <code>perf mem</code> — memory access profiling. Wymaga: <code>kernel.perf_event_paranoid=1</code>." },
    { q: "Co to eBPF i jak używać bpftrace?", a: "eBPF: sandboxowane programy w kernelu bez modyfikacji kodu. <code>bpftrace -e 'tracepoint:syscalls:sys_enter_open { printf(\"%s %s\\n\", comm, str(args->filename)); }'</code>. Gotowe narzędzia (bcc-tools): <code>execsnoop, opensnoop, tcpconnect, biolatency, runqlat, cachetop</code>. Profiling: <code>profile-bpfcc -F 99 -p PID 30</code>. Bez overhead jak strace — bezpieczne na produkcji." },
    { q: "Co to control groups freezer i jak zatrzymać grupę procesów?", a: "<code>systemctl freeze nginx.service</code> — zawiesza wszystkie procesy serwisu (SIGSTOP). <code>systemctl thaw nginx.service</code> — wznawia. Manualnie: <code>echo FROZEN > /sys/fs/cgroup/system.slice/nginx.service/cgroup.freeze</code>. Użycie: maintenance bez killowania procesów, snapshot VM (QEMU używa freezera). <code>systemd-run --scope --slice=test.slice cmd</code> — tymczasowy scope." },
    { q: "Jak działa wirtualna pamięć i page fault?", a: "Każdy proces ma własną przestrzeń adresową (VMAs — Virtual Memory Areas). Page fault: dostęp do strony nieładowanej w RAM → kernel ładuje z dysku/zeruje. Minor fault: strona jest w pamięci (CoW po fork). Major fault: odczyt z dysku (I/O). <code>cat /proc/PID/smaps</code> — szczegóły VMAs. <code>vmstat -w 1</code>: <code>si/so</code>=swap, <code>bi/bo</code>=block I/O." },
    { q: "Co to POSIX shared memory i IPC?", a: "Mechanizmy IPC: shared memory (<code>shm_open</code>), semafory (<code>sem_open</code>), kolejki komunikatów (<code>mq_open</code>). Sprawdź: <code>ipcs -a</code> (System V IPC). POSIX: <code>ls /dev/shm/</code>. Bazy danych używają SHM dla shared_buffers. Czyść: <code>ipcrm -m ID</code>. Limits: <code>kernel.shmmax</code>, <code>kernel.shmall</code>. <code>/proc/sys/kernel/shm*</code>." },
    { q: "Jak zarządzać certyfikatami systemowymi (trust store) w RHEL?", a: "<span class='tip-badge tip-cmd'>CMD</span> Trust store: <code>/etc/pki/ca-trust/</code>. Dodaj CA: skopiuj <code>.crt</code> do <code>/etc/pki/ca-trust/source/anchors/</code> + <code>update-ca-trust</code>. Sprawdź: <code>trust list</code>. Usuń: <code>/etc/pki/ca-trust/source/blacklist/</code>. Java keystore osobny: <code>keytool -importcert</code>. <code>openssl s_client -connect host:443 -CApath /etc/ssl/certs</code> — weryfikuj." },
    { q: "Jak analizować i rozwiązywać problemy z NFS?", a: "<code>showmount -e nfsserver</code> — eksporty. <code>nfsstat -c</code> — statystyki klienta. <code>nfsiostat 1</code> — I/O per mount. Hung mount: <code>mount -o soft,timeo=30,retrans=3</code> (soft — timeout zamiast wiecznego czekania). <code>rpcinfo -p nfsserver</code> — sprawdź RPC. Wersja: <code>mount -t nfs4</code>. Kerberos: <code>klist, kinit</code>. Debug: <code>rpcdebug -m nfs -s all</code>." },
    { q: "Co to systemd-nspawn i jak działa w porównaniu do Docker?", a: "Lekkie kontenery oparte o namespaces, bez daemona. <code>systemd-nspawn -D /var/lib/machines/mycontainer</code>. Boot: <code>systemd-nspawn -b -D /var/lib/machines/mycontainer</code>. Zarządzanie: <code>machinectl start/stop/shell mycontainer</code>. Sieć: <code>--network-bridge=br0</code>. Głównie dev/testing. Docker: lepsza izolacja, ecosystem, OCI images. nspawn: prostszy, tight systemd integration." },
    { q: "Jak działają file capabilities vs SUID — kiedy co używać?", a: "SUID (<code>chmod u+s binary</code>): całe uprawnienia właściciela przy wykonaniu — niebezpieczne (jeśli właściciel root = pełny root). Capabilities: granularne, np. <code>cap_net_bind_service</code> pozwala bindować port <1024 bez root. <code>setcap cap_net_bind_service=ep /usr/bin/node</code>. <code>getcap -r / 2>/dev/null</code> — znajdź wszystkie. Zasada: zawsze capabilities > SUID." },
    { q: "Co to Linux audit framework i jak pisać reguły?", a: "auditd rejestruje zdarzenia na poziomie kernela. Reguły: <code>-w /etc/passwd -p wa -k passwd_mod</code>. Syscall: <code>-a always,exit -F arch=b64 -S execve -k exec_commands</code>. <code>-F uid=0</code> — tylko root. Szukaj: <code>ausearch -k exec_commands -ts today</code>. Raport: <code>aureport -x --summary</code>. RHEL: domyślne reguły CIS w <code>/etc/audit/rules.d/</code>." },
    { q: "Jak działa Linux scheduling i klasy priorytetów?", a: "CFS (Completely Fair Scheduler): domyślny, sprawiedliwy podział CPU. Priorytety nice: -20 (najwyższy) do 19 (najniższy). RT (real-time): <code>SCHED_FIFO</code> i <code>SCHED_RR</code> mają priorytet nad CFS. <code>chrt -f 50 ./app</code> — ustaw FIFO RT. <code>taskset -c 0,1 ./app</code> — CPU affinity. Sprawdź: <code>chrt -p PID</code>. Latency: <code>cyclictest</code> dla RT kerneli." },
    { q: "Co to kernel live patching (kpatch) w RHEL?", a: "<span class='tip-badge tip-info'>INFO</span> Patchowanie kernela bez rebootu. RHEL: <code>kpatch</code> lub Kernel Live Patching przez subscription. <code>dnf install kpatch-patch-$(uname -r | tr - _)</code>. <code>kpatch list</code>. Ograniczenia: tylko security patches, nie wszystkie CVE obsługiwane. Wymaga aktywnej RHEL subscription. Zscaler Livepatch (Ubuntu), Oracle Ksplice — alternatywy dla innych distros." },
    { q: "Jak skonfigurować bonding i sprawdzić failover?", a: "<span class='tip-badge tip-cmd'>CMD</span> LACP (802.3ad): <code>nmcli con add type bond con-name bond0 bond.options 'mode=802.3ad,miimon=100,lacp_rate=fast'</code>. Dodaj interfejsy: <code>nmcli con add type ethernet ifname eth0 master bond0</code>. Sprawdź: <code>cat /proc/net/bonding/bond0</code> — active slave, MII status. Failover test: <code>ip link set eth0 down</code> → sprawdź czy ruch przełączył. <code>bonding_masters</code> w sysfs." },
    { q: "Jak rozwiązywać problemy z disk I/O wait (iowait)?", a: "Wysoki iowait: CPU czeka na I/O. <code>iostat -xz 1</code>: <code>%util > 80%</code> = dysk saturated. <code>await > 20ms</code> = wolne dyski. <code>iotop -ao</code> — który proces generuje I/O. <code>blktrace + blkparse</code> — szczegóły. Przyczyny: wolny storage, brak cache, dużo losowych I/O, RAID rebuild. Rozwiązanie: SSD, więcej RAM (page cache), async I/O, I/O scheduler." },
    { q: "Co to rpm i jak zarządzać pakietami poza dnf?", a: "<code>rpm -ivh package.rpm</code>. Sprawdź pliki: <code>rpm -ql package</code>. Który pakiet dostarcza plik: <code>rpm -qf /usr/bin/top</code>. Verify: <code>rpm -V package</code> (sprawdza checksums). Sprawdź skrypty: <code>rpm -q --scripts package</code>. Import GPG: <code>rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat</code>. Baza RPM: <code>/var/lib/rpm/</code>. Rebuild: <code>rpm --rebuilddb</code>." },
    { q: "Jak zarządzać środowiskami wirtualnymi i izolacją w RHEL?", a: "Containers (podman/docker): pełna izolacja procesu. systemd-nspawn: OS-level container. chroot: uproszczona izolacja FS (nie pełna). virtual env Python: <code>python3 -m venv /opt/myenv</code>. Nix/Guix: deklaratywne środowiska. SCL (RHEL 7): Software Collections. Flatpak: desktop apps. Snap: nie wspierany oficjalnie na RHEL. Podman play kube: K8s pods lokalnie." },
    { q: "Jak debugować problemy z pamięcią (memory leak, fragmentation)?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>valgrind --leak-check=full ./app</code>. <code>AddressSanitizer</code>: kompiluj z <code>-fsanitize=address</code>. <code>/proc/PID/smaps_rollup</code>: RSS, PSS, Shared. Fragmentacja: <code>cat /proc/buddyinfo</code>. <code>slabtop</code>: kernel slab allocator. <code>pmap -x PID</code>: memory map. <code>perf mem record</code>. <code>heaptrack</code>: szczegółowy heap profiler. Sprawdź: <code>cat /proc/meminfo | grep -i huge</code>." },
    { q: "Co to systemd portable services i co-re?", a: "<span class='tip-badge tip-info'>INFO</span> Portable services: self-contained image (DDI — Discoverable Disk Image) z serwisem + dependencies. Attach: <code>portablectl attach myapp.raw</code>. Uruchom: <code>systemctl start myapp</code>. Izolacja przez namespaces + RootImage. Nie wymaga kontenera. <code>systemd-dissect myapp.raw</code>. Przyszłość RHEL: alternatywa dla RPM dla self-contained apps. UKI (Unified Kernel Image) — kernel+initrd+cmdline w jednym pliku." },
    { q: "Jak działają Linux capabilities w kontekście bezpieczeństwa kontenera?", a: "Kontenery domyślnie mają subset capabilities: DROP ALL + ADD kilka (net_bind, chown, setuid itp.). <code>capsh --print</code> — aktualny zestaw. Niebezpieczne: <code>CAP_SYS_ADMIN</code> (prawie root), <code>CAP_NET_ADMIN</code>, <code>CAP_SYS_PTRACE</code>. Docker: <code>--cap-drop ALL --cap-add NET_BIND_SERVICE</code>. K8s: <code>securityContext.capabilities.drop: [ALL]</code>. Audit: <code>captest</code>." }
  ]},

  { title: "Linux — Bash Scripting", cat: "System", qa: [
    { q: "Jak napisać solidny skrypt bash z obsługą błędów?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Zawsze: <code>#!/bin/bash\nset -euo pipefail</code>. <code>-e</code>: wyjdź przy błędzie, <code>-u</code>: błąd niezdefiniowanej zmiennej, <code>-o pipefail</code>: błąd w pipeline. Trap: <code>trap 'echo ERR line $LINENO' ERR</code>. Cleanup: <code>trap 'rm -f /tmp/lock' EXIT</code>. Lockfile: <code>flock -n /tmp/lock -c './script.sh'</code>. Logi: <code>exec 1> >(tee /var/log/script.log) 2>&1</code>." },
    { q: "Jak efektywnie przetwarzać pliki i pętle w bash?", a: "<span class='tip-badge tip-cmd'>CMD</span> Poprawna pętla pliku: <code>while IFS= read -r line; do echo \"$line\"; done < plik</code> (nie <code>cat | while read</code>). Pliki z spacjami: <code>find . -name '*.log' -print0 | xargs -0 -P8 process</code>. Równoległy: <code>parallel -j8 gzip ::: *.log</code>. Arrays: <code>arr=(a b c); for x in \"${arr[@]}\"; do ...; done</code>. Associative: <code>declare -A map; map[key]=val; echo ${map[key]}</code>." },
    { q: "Jak debugować skrypt bash?", a: "<code>bash -x script.sh</code> — trace każdej komendy. <code>bash -n script.sh</code> — syntax check. Sekcja debug: <code>set -x</code>...<code>set +x</code>. Lepsza diagnostyka: <code>PS4='+(${BASH_SOURCE}:${LINENO}): '</code>. <code>declare -p zmienna</code> — wartość. Static analysis: <code>shellcheck script.sh</code> (wykrywa typowe błędy). <code>strace -e trace=file -p PID</code> — co otwiera. Sprawdzaj <code>$?</code> po każdej ważnej komendzie." },
    { q: "Jak zarządzać procesami w tle (background jobs)?", a: "<code>komenda &</code> tło. <code>PID=$!</code> PID ostatniego bg. <code>wait $PID</code> czekaj. <code>jobs -l</code> lista. <code>disown %1</code> odepnij od terminala. <code>nohup cmd &</code> odporna na SIGHUP. tmux/screen dla trwałych sesji. <code>kill -0 $PID 2>/dev/null</code> sprawdź czy żyje. Parallel z kontrolą: <code>sem --id JOBGROUP -j4 cmd; sem --id JOBGROUP --wait</code>." },
    { q: "Jak używać funkcji i modularyzacji w bash?", a: "<code>function validate() { local input=$1; [[ -z $input ]] && return 1; echo \"$input\"; }</code>. <code>local</code> dla zmiennych lokalnych — zawsze używaj. Source: <code>source lib/helpers.sh</code> lub <code>. lib/helpers.sh</code>. Return codes: 0=sukces, 1-255=błąd. <code>readonly VAR=wartość</code> dla stałych. Sprawdź: <code>declare -f function_name</code>. Eksport: <code>export -f function_name</code> dla subshell." },
    { q: "Jak używać pętli w bash?", a: "<span class='tip-badge tip-cmd'>CMD</span> <strong>for po liście:</strong> <code>for item in a b c; do echo $item; done</code>. <strong>for po zakresie:</strong> <code>for i in {1..5}; do echo $i; done</code>. <strong>for C-style (jak w C/Java):</strong> <code>for ((i=0; i&lt;10; i++)); do echo $i; done</code>. <strong>for po plikach:</strong> <code>for f in /var/log/*.log; do echo $f; done</code>. <strong>for po wyjściu komendy:</strong> <code>for pid in $(pgrep nginx); do kill $pid; done</code>. <strong>while — dopóki warunek prawdziwy:</strong> <code>while [[ $count -lt 5 ]]; do echo $count; ((count++)); done</code>. <strong>while czyta plik linia po linii:</strong> <code>while IFS= read -r line; do echo &quot;$line&quot;; done &lt; plik.txt</code> — poprawna metoda (nie <code>cat | while</code>). <strong>until — dopóki warunek fałszywy (odwrotność while):</strong> <code>until ping -c1 serwer &amp;&gt;/dev/null; do sleep 5; done</code> — czekaj aż serwer odpowie. <strong>break/continue:</strong> <code>break</code> wychodzi z pętli, <code>continue</code> przechodzi do następnej iteracji. Kiedy co: <code>for</code> gdy znasz liczbę iteracji lub listę, <code>while</code> gdy czekasz na warunek lub czytasz plik, <code>until</code> gdy czekasz aż coś zadziała." },
    { q: "Co to declare i jak typować zmienne w bash?", a: "<span class='tip-badge tip-info'>INFO</span> Bash domyślnie traktuje wszystko jako string — <code>declare</code> pozwala nadać zmiennej typ lub właściwość. <strong>Typy:</strong> <code>declare -i liczba=5</code> — integer (arytmetyka bez <code>$(())</code>: <code>liczba+=3</code> daje 8, nie &quot;53&quot;). <code>declare -r STALA=wartość</code> — readonly (jak <code>readonly</code>, błąd przy próbie zmiany). <code>declare -a tablica=(a b c)</code> — indexed array: <code>${tablica[0]}</code>, <code>${tablica[@]}</code> wszystkie, <code>${#tablica[@]}</code> liczba elementów. <code>declare -A mapa</code> — associative array (słownik): <code>mapa[klucz]=wartość</code>, <code>${mapa[klucz]}</code>, <code>${!mapa[@]}</code> wszystkie klucze. <code>declare -x ZMIENNA</code> — eksportuj (jak <code>export</code>). <code>declare -l tekst</code> — lowercase automatycznie. <code>declare -u tekst</code> — uppercase automatycznie. <strong>Podgląd:</strong> <code>declare -p zmienna</code> — pokaż typ i wartość. <code>declare -f funkcja</code> — pokaż kod funkcji. <strong>Zasięg:</strong> zmienne są globalne — użyj <code>local</code> wewnątrz funkcji żeby ograniczyć zasięg." }
  ]},

  { title: "Performance Tuning", cat: "System", qa: [
    { q: "Jak zidentyfikować bottleneck systemu?", a: "<span class='tip-badge tip-cmd'>CMD</span> Metodologia USE (Utilization, Saturation, Errors). CPU: <code>top, mpstat -P ALL 1, perf top</code>. RAM: <code>free -h, vmstat 1, /proc/meminfo</code>. I/O: <code>iostat -xz 1, iotop, dstat</code>. Sieć: <code>sar -n DEV 1, iftop, nethogs, ss -s</code>." },
    { q: "Kluczowe parametry sysctl dla wydajności?", a: "<code>net.core.somaxconn=65535</code> (listen queue). <code>net.ipv4.tcp_tw_reuse=1</code>. <code>vm.swappiness=10</code> (mniej swapowania). <code>vm.dirty_ratio=15</code>. <code>net.core.rmem_max/wmem_max</code> (bufory sieciowe). <code>fs.file-max</code> (limit plików). Trwałe: <code>/etc/sysctl.d/</code>." },
    { q: "Co to hugepages i kiedy używać?", a: "Strony pamięci 2MB (lub 1GB) zamiast 4KB — mniej TLB misses dla dużych aplikacji. Dla: Oracle DB, PostgreSQL (shared_buffers), KVM gości (transparent hugepages), HPC. <code>vm.nr_hugepages=512</code>. Transparent: <code>always/madvise/never</code>. Bazy preferują madvise lub never." },
    { q: "Jak profilować CPU?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>perf record -g -p PID sleep 30 && perf report</code>. Flame graphs (Brendan Gregg): <code>perf script | flamegraph.pl > out.svg</code>. <code>strace -c -p PID</code> (syscall statistics). BPF: <code>bpftrace -e 'profile:hz:99 { @[kstack] = count(); }'</code>." },
    { q: "Jak optymalizować I/O?", a: "I/O schedulers: <code>mq-deadline</code> (SSD/SAN), <code>none</code> (NVMe), <code>bfq</code> (desktop). Sprawdź: <code>cat /sys/block/sda/queue/scheduler</code>. Read-ahead: <code>blockdev --setra 256 /dev/sda</code>. NUMA: <code>numactl --cpunodebind=0 --membind=0 ./app</code>. iostat dla analizy." },
    { q: "Jak analizować problemy z pamięcią?", a: "<code>vmstat 1</code>: si/so (swap in/out) — jeśli > 0 to problem. <code>free -h</code>: buff/cache jest dostępne. <code>/proc/PID/smaps</code>: szczegóły procesu. OOM killer: <code>dmesg | grep -i 'oom\|killed'</code>. Memory pressure: <code>cat /proc/pressure/memory</code> (PSI)." },
    { q: "Co to proces zombie i jak sobie z nim radzić?", a: "<span class='tip-badge tip-info'>INFO</span> Zombie (stan <code>Z</code>) = proces który zakończył działanie, ale rodzic nie odebrał jego kodu wyjścia (<code>wait()</code>). Zajmuje tylko wpis w tablicy procesów — nie zużywa CPU ani RAM, ale tysiące zombi wyczerpują pulę PID. Skąd się bierze: błąd w aplikacji — rodzic nie wywołuje <code>wait()</code> po śmierci dziecka. Wykrywanie: <code>ps aux | grep Z</code> lub <code>ps aux | awk '$8==&quot;Z&quot;'</code>. Liczba zombi: <code>cat /proc/loadavg</code> (ostatnia kolumna np. <code>3/142</code> — living/total). <strong>Nie można</strong> zabić zombie przez <code>kill -9</code> — jest już martwy. Rozwiązania: 1) <code>kill -SIGCHLD &lt;PID_RODZICA&gt;</code> — sygnał do rodzica żeby odebrał status dziecka. 2) Zabij rodzica (<code>kill &lt;PID_RODZICA&gt;</code>) — zombie przejmuje init/systemd który automatycznie robi <code>wait()</code>. 3) Długoterminowo: napraw kod aplikacji." }
  ]},

  { title: "RHCSA / RHCE — Egzaminy", cat: "System", qa: [
    { q: "Kluczowe tematy RHCSA (EX200)?", a: "Essentials: pliki/uprawnienia/ACL, SELinux, systemd, sieć (nmcli/nmtui), użytkownicy/sudo, cron/at, LVM/Stratis, autofs, SSH, firewalld, containers (podman). Ważne: rozwiązywanie problemów startowych (broken root pw, SELinux relabeling)." },
    { q: "Co to RHCE (EX294)?", a: "Od RHEL 8 = egzamin z Ansible. Playbooki, role, inventory, fakty, zmienne, Vault, templates (Jinja2), handlers, zarządzanie pakietami/usługami/użytkownikami/siecią przez Ansible. Automatyzacja zadań z RHCSA poziomem." },
    { q: "Jak debugować problemy startowe RHEL?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> GRUB: klawisz E → edycja → dopisz <code>rd.break</code> (initramfs rescue) lub <code>systemd.unit=rescue.target</code>. W rd.break: <code>mount -o remount,rw /sysroot && chroot /sysroot</code>, napraw, <code>touch /.autorelabel</code> (relabeling SELinux). <code>journalctl -b -1</code> poprzedni boot." },
    { q: "Jak skonfigurować autofs?", a: "<code>/etc/auto.master</code>: <code>/misc /etc/auto.misc</code>. <code>/etc/auto.misc</code>: <code>nfs_share -rw,sync nfsserver:/export/data</code>. Indirect map dla dynamicznych mountów (<code>/-</code> dla direct). <code>systemctl enable --now autofs</code>. Auto-unmount po timeout (domyślnie 5min)." },
    { q: "Jak zarządzać siecią przez nmcli?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>nmcli con add type ethernet ifname eth0 con-name mycon</code>. IP: <code>nmcli con mod mycon ipv4.addresses 192.168.1.10/24 ipv4.gateway 192.168.1.1 ipv4.method manual</code>. DNS: <code>ipv4.dns '8.8.8.8 1.1.1.1'</code>. Aktywuj: <code>nmcli con up mycon</code>. Bond/Team/Bridge przez nmcli." },
    { q: "Co to podman w kontekście RHCSA?", a: "Rootless containers w RHEL 8+. <code>podman run -d --name web -p 8080:80 nginx</code>. Systemd integration: <code>podman generate systemd --name web > /etc/systemd/system/web.service</code>. Persistent: <code>loginctl enable-linger username</code> dla user services. <code>podman pod</code> dla grup kontenerów." }
  ]},

  { title: "Security / CIS / SELinux", cat: "Security", qa: [
    { q: "Co to CIS Benchmarks?", a: "Center for Internet Security — zbiór najlepszych praktyk hardeningu. Profile: Level 1 (minimalne zakłócenia działania, szeroko stosowalny) i Level 2 (głębsze bezpieczeństwo, wymaga testów). Dostępne dla RHEL, Ubuntu, Cloud (AWS, Azure), Docker, Kubernetes." },
    { q: "Jak skonfigurować SELinux?", a: "<span class='tip-badge tip-info'>INFO</span> Tryby: <code>Enforcing</code> (aktywny), <code>Permissive</code> (loguje, nie blokuje), <code>Disabled</code>. Sprawdź: <code>getenforce</code>. Trwała zmiana: <code>/etc/selinux/config</code>. Kontekst: <code>ls -Z</code>. Napraw: <code>restorecon -Rv /var/www</code>. Deny logi: <code>ausearch -m avc</code>." },
    { q: "Co to sudoers i jak bezpiecznie edytować?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Zawsze używaj <code>visudo</code> — weryfikuje składnię przed zapisem. Zasada minimalnych uprawnień: <code>jan ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart nginx</code>. Drop-in files w <code>/etc/sudoers.d/</code>. Nigdy <code>chmod 777</code> na sudoers." },
    { q: "Jak działa firewalld?", a: "<span class='tip-badge tip-cmd'>CMD</span> Koncepcja stref (zones). <code>firewall-cmd --get-active-zones</code>. Dodaj usługę: <code>firewall-cmd --permanent --add-service=https --zone=public</code>. Port: <code>--add-port=8080/tcp</code>. Zastosuj: <code>--reload</code>. Rich rules dla zaawansowanego filtrowania." },
    { q: "Co to auditd?", a: "Demon audytowania wywołań systemowych. Reguły w <code>/etc/audit/rules.d/</code>. Przykład: monitoruj zapis do <code>/etc/passwd</code>: <code>-w /etc/passwd -p wa -k passwd_changes</code>. Szukaj: <code>ausearch -k passwd_changes</code>. Raport: <code>aureport --summary</code>." },
    { q: "Jak skonfigurować SSH securely?", a: "W <code>/etc/ssh/sshd_config</code>: <code>PermitRootLogin no</code>, <code>PasswordAuthentication no</code>, <code>PubkeyAuthentication yes</code>, <code>Port 2222</code>, <code>AllowUsers jan devops</code>, <code>MaxAuthTries 3</code>. Klucze: <code>ssh-keygen -t ed25519</code>. Fail2ban dla ochrony przed brute-force." },
    { q: "Co to PAM (Pluggable Authentication Modules)?", a: "Modułowy system autentykacji Linux. Konfiguracja: <code>/etc/pam.d/</code>. Moduły: <code>pam_unix</code> (local auth), <code>pam_ldap</code> (LDAP), <code>pam_pwquality</code> (polityka haseł), <code>pam_faillock</code> (lockout). Stack: auth, account, password, session." },
    { q: "Jak działa PKI i certyfikaty TLS?", a: "CA → cert req (CSR) → podpisanie → cert. OpenSSL: <code>openssl req -new -key key.pem -out csr.pem</code>. Sprawdź cert: <code>openssl x509 -in cert.pem -text -noout</code>. Let's Encrypt: <code>certbot certonly</code>. Weryfikacja łańcucha: <code>openssl verify -CAfile ca.pem cert.pem</code>." },
    { q: "Co to LUKS i jak szyfrować dyski?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>cryptsetup luksFormat /dev/sdb1</code>. Otwórz: <code>cryptsetup open /dev/sdb1 mydata</code>. Format: <code>mkfs.ext4 /dev/mapper/mydata</code>. Auto-mount: <code>/etc/crypttab</code>. Dodaj klucz: <code>cryptsetup luksAddKey /dev/sdb1</code>." },
    { q: "Jak skonfigurować fail2ban?", a: "<code>/etc/fail2ban/jail.local</code>: <code>[sshd]\nenabled = true\nmaxretry = 3\nbantime = 3600\nfindtime = 600</code>. Status: <code>fail2ban-client status sshd</code>. Odbanuj: <code>fail2ban-client set sshd unbanip 1.2.3.4</code>." },
    { q: "Co to FIPS mode w RHEL?", a: "Federal Information Processing Standards — tryb wymuszający użycie zatwierdzonych algorytmów kryptograficznych (SHA-256+, AES, RSA 2048+). Włącz: <code>fips-mode-setup --enable</code> + reboot. Sprawdź: <code>fips-mode-setup --check</code>. MD5 i SHA1 są wyłączone." },
    { q: "Jak zarządzać kluczami GPG/PGP?", a: "<code>gpg --gen-key</code>. Eksport: <code>gpg --export -a 'Jan' > jan.pub.key</code>. Import: <code>gpg --import jan.pub.key</code>. Szyfruj: <code>gpg -e -r jan plik</code>. Deszyfruj: <code>gpg -d plik.gpg</code>. RPM weryfikacja: <code>rpm --checksig package.rpm</code>." }
  ]},

  { title: "Linux / Security — Mid Level", cat: "Security", qa: [
    { q: "Jak działa Linux capabilities i dlaczego lepsze niż SUID?", a: "<span class='tip-badge tip-info'>INFO</span> Capabilities dzielą uprawnienia root na granularne jednostki: CAP_NET_BIND_SERVICE (port <1024), CAP_SYS_PTRACE, CAP_NET_ADMIN itp. <code>getcap /usr/bin/ping</code>. Nadaj: <code>setcap cap_net_bind_service=ep ./app</code>. Bezpieczniejsze niż SUID bo nie daje pełnego roota. Kontenery: <code>--cap-drop ALL --cap-add NET_BIND_SERVICE</code>." },
    { q: "Co to eBPF i jakie ma zastosowania security?", a: "Extended Berkeley Packet Filter — uruchamia sandboxowane programy w kernelu bez modyfikacji kodu kernela. Security: Falco (runtime threat detection), Cilium (network policy L7), seccomp-bpf (syscall filtering). Observability: bpftrace, perf. <code>bpftrace -e 'tracepoint:syscalls:sys_enter_execve { printf(\"%s\\n\", str(args->filename)); }'</code>" },
    { q: "Jak działa seccomp i jak filtrować syscalle?", a: "Secure Computing Mode — filtruje wywołania systemowe procesu. Profil JSON definiuje białą/czarną listę. Docker domyślnie używa seccomp profile (blokuje ~44 syscalls). Kubernetes: <code>securityContext.seccompProfile.type: RuntimeDefault</code>. Custom: <code>Localhost</code> z własnym profilem. <code>strace</code> do audytu syscalli aplikacji." },
    { q: "Jak działa AppArmor vs SELinux?", a: "AppArmor: profile per aplikację (ścieżki plików, capabilities, sieci). Prostszy w konfiguracji. Domyślny w Ubuntu/Debian. SELinux: label-based MAC (każdy obiekt i podmiot ma kontekst). Bardziej granularny, trudniejszy. Domyślny w RHEL/CentOS. Oba można łączyć z seccomp. AppArmor: <code>aa-genprof</code> do generowania profili." },
    { q: "Co to supply chain security i jak zabezpieczać?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Ataki na zależności (SolarWinds, log4shell). Narzędzia: Trivy/Grype (skanowanie CVE w obrazach i plikach), Syft (SBOM — Software Bill of Materials), Sigstore/cosign (podpisywanie obrazów), SLSA (Supply chain Levels for Software Artifacts — framework poziomów bezpieczeństwa łańcucha dostaw). Policy: tylko podpisane obrazy w K8s (OPA/Kyverno)." },
    { q: "Jak działają Linux namespaces i cgroups (podstawy kontenerów)?", a: "Namespaces: izolacja zasobów — pid (procesy), net (sieć), mnt (filesystemy), uts (hostname), ipc, user (UID mapping), cgroup. Cgroups v2: limity CPU (cpu.max), pamięci (memory.max), I/O (io.max). Kontenery = procesy z namespacami + cgroupami. <code>lsns</code> lista namespaces. <code>nsenter -t PID -n ip addr</code>." },
    { q: "Jak przeprowadzić hardening SSH dla środowiska produkcyjnego?", a: "<code>AllowUsers devops ansible</code>. <code>Match Address 10.0.0.0/8</code> bloki. <code>LoginGraceTime 20</code>. <code>ClientAliveInterval 300</code>. <code>ClientAliveCountMax 2</code>. Ed25519 zamiast RSA. <code>KexAlgorithms curve25519-sha256</code>. <code>Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com</code>. Bastion host + jump: <code>ProxyJump bastion</code>." },
    { q: "Co to SIEM i jak integrować Linux z nim?", a: "Security Information and Event Management — zbiera, koreluje, alertuje na zdarzenia security. Stack: auditd → rsyslog/syslog-ng → Splunk/Elastic SIEM. Kluczowe logi: /var/log/auth.log, /var/log/secure, auditd, syslog. OSSEC/Wazuh: open-source HIDS. Reguły korelacji: login failures + privilege escalation + data exfiltration = alert." },
    { q: "Jak działają Linux ACL vs DAC vs MAC?", a: "DAC (Discretionary): standardowe uprawnienia Unix (chmod, chown) — właściciel kontroluje dostęp. ACL: rozszerzenie DAC (setfacl) — per-user/group granularne uprawnienia. MAC (Mandatory): SELinux/AppArmor — system wymusza politykę niezależnie od właściciela. Hierarchia: MAC > DAC > ACL. Kontener security: wszystkie trzy warstwy." },
    { q: "Co to kernel hardening i kluczowe opcje?", a: "<span class='tip-badge tip-cmd'>CMD</span> sysctl: <code>kernel.dmesg_restrict=1</code>, <code>kernel.kptr_restrict=2</code>, <code>net.ipv4.conf.all.rp_filter=1</code> (anti-spoofing), <code>net.ipv4.tcp_syncookies=1</code> (SYN flood), <code>fs.suid_dumpable=0</code>. GRUB: <code>lockdown=confidentiality</code>. Grsecurity/PaX (patchset). CIS benchmark automatyzuje te ustawienia." }
  ]},

  { title: "Linux — Security Hardening", cat: "Security", qa: [
    { q: "Jak przeprowadzić hardening SSH dla produkcji?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> <code>PermitRootLogin no</code>. <code>PasswordAuthentication no</code>. <code>PubkeyAuthentication yes</code>. <code>AllowUsers devops ansible</code>. <code>LoginGraceTime 20</code>. <code>MaxAuthTries 3</code>. <code>ClientAliveInterval 300\nClientAliveCountMax 2</code>. Ed25519 zamiast RSA. Algorytmy: <code>KexAlgorithms curve25519-sha256\nCiphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com</code>. Jump/bastion: <code>ProxyJump bastion.firma.pl</code>." },
    { q: "Co to CIS Benchmarks i jak automatycznie stosować?", a: "CIS Benchmarks: best practices hardeningu (Level 1 = minimalne zakłócenia, Level 2 = głębsze security). Automatyzacja: <code>openscap</code> — <code>oscap xccdf eval --profile xccdf_org.ssgproject.content_profile_cis /usr/share/xml/scap/ssg/content/ssg-rhel9-ds.xml</code>. Ansible role: <code>ansible-lockdown/RHEL9-CIS</code>. Raport HTML: <code>--report /tmp/cis-report.html</code>. Chef InSpec dla compliance testing: <code>inspec exec cis-rhel9 -t ssh://host</code>." },
    { q: "Jak zarządzać PKI i własnym CA?", a: "<span class='tip-badge tip-cmd'>CMD</span> Root CA: <code>openssl genrsa -aes256 -out ca.key 4096 && openssl req -new -x509 -days 3650 -key ca.key -out ca.crt</code>. Podpisanie: <code>openssl ca -config ca.cnf -in server.csr -out server.crt -days 365</code>. CFSSL (CloudFlare) dla automatyzacji. cert-manager w K8s: <code>Issuer/ClusterIssuer</code> z CA lub ACME. Hashicorp Vault PKI secrets engine: automatyczne wydawanie certów z TTL. Sprawdź: <code>openssl verify -CAfile ca.crt server.crt</code>." },
    { q: "Jak wykrywać i reagować na intruzje (IDS/IPS)?", a: "Wazuh (OSSEC fork): HIDS — monitoruje pliki, logi, rootkit detection. Snort/Suricata: NIDS — analizuje ruch sieciowy. Stack: Wazuh agents → Wazuh manager → Elasticsearch/Kibana. Reguły: <code>syscheck</code> (file integrity), <code>rootcheck</code>, <code>log analysis</code>. Falco (K8s): runtime security — wykrywa anomalne syscalle. MITRE ATT&CK mapping. Reakcja: automatyczny ban przez Wazuh active response." },
    { q: "Co to Zero Trust i jak implementować w Linux?", a: "<span class='tip-badge tip-info'>INFO</span> Zasada: never trust, always verify. Implementacja: mTLS między serwisami (Istio/Linkerd), PAM + MFA dla każdego logowania, krótkotrwałe certyfikaty SSH (Vault SSH CA: <code>vault write ssh/sign/role public_key=@key.pub</code> → cert ważny 1h), BeyondCorp model (dostęp per tożsamość + urządzenie, nie sieć). Network: micro-segmentacja NSX/Cilium. Audit: wszystkie privileged actions." }
  ]},

  { title: "Networking / TCP / DNS", cat: "Networking", qa: [
    { q: "TCP handshake — jak działa?", a: "3-way: SYN → SYN-ACK → ACK. Zamknięcie: FIN → FIN-ACK → ACK. Stany: ESTABLISHED, TIME_WAIT (2×MSL po zamknięciu), CLOSE_WAIT (remote zamknął, local nie), SYN_SENT. Diagnostyka: <code>ss -tnp</code>, <code>netstat -anp</code>." },
    { q: "Jak działa DNS resolution?", a: "<span class='tip-badge tip-info'>INFO</span> Query → stub resolver → recursive resolver (ISP/8.8.8.8) → root nameserver (.) → TLD (.com) → authoritative NS → odpowiedź z rekordem. TTL kontroluje cache. Trace: <code>dig +trace example.com</code>. Typy rekordów: A, AAAA, CNAME, MX, TXT, NS, PTR, SRV." },
    { q: "Co to VLAN i routing inter-VLAN?", a: "VLAN = logiczna izolacja L2 (IEEE 802.1Q trunking). Inter-VLAN routing: router-on-a-stick (trunk + subinterfaces) lub L3 switch (SVI). W Linux: <code>ip link add link eth0 name eth0.10 type vlan id 10 && ip link set eth0.10 up</code>." },
    { q: "Narzędzia diagnostyki sieci w Linux?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>ping, traceroute/mtr, ss -tnp, ip addr/route/neigh, tcpdump -i eth0 port 80, nmap -sV host, curl -v, netcat -zv host 443, iperf3 -s/-c, nslookup/dig, ethtool eth0</code>. MTU: <code>ping -M do -s 1472 host</code>." },
    { q: "Co to BGP i OSPF?", a: "OSPF: IGP, link-state, Dijkstra SPF, fast convergence, używany wewnątrz AS. BGP: EGP, path-vector, routing między AS (Internet backbone). eBGP między ISP, iBGP wewnątrz AS. BGP atrybuty: AS-PATH, LOCAL_PREF, MED, NEXT_HOP." },
    { q: "Co to iptables vs nftables?", a: "iptables: stary, per-protokołowy (iptables/ip6tables/arptables). nftables: następca, jeden framework dla wszystkich protokołów, lepsza wydajność (single ruleset lookup), nowoczesna składnia. RHEL 8+: nftables domyślny backend. firewalld używa nftables pod spodem." },
    { q: "Jak skonfigurować bonding/teaming w Linux?", a: "Bonding: aktywny-pasywny (mode 1), LACP (802.3ad, mode 4), round-robin (0), balance-alb (6). <code>nmcli con add type bond con-name bond0 ifname bond0 bond.options 'mode=active-backup'</code>. Teaming: nowszy, JSON config, daemon teamd." },
    { q: "Co to NAT i jak działa?", a: "Network Address Translation. SNAT (masquerade): zmiana source IP (private → public). DNAT: port forwarding (public IP:port → private IP:port). Full-cone NAT vs symmetric NAT. W Linux: iptables MASQUERADE / DNAT lub <code>ip_forward = 1</code>." },
    { q: "Co to Load Balancer L4 vs L7?", a: "L4 (transport): HAProxy TCP mode, AWS NLB — szybszy, bazuje na IP/porcie, nie czyta treści. L7 (aplikacyjny): Nginx, HAProxy HTTP, AWS ALB — URL-based routing, host header, SSL termination, cookie persistence, health check per endpoint." },
    { q: "Jak działa DHCP?", a: "DORA (Discover → Offer → Request → Acknowledge): Discover (broadcast) → Offer (serwer proponuje IP) → Request (klient akceptuje) → Acknowledge. Lease time. DHCP reservations (MAC → fixed IP). Relay agent dla wielu subnets. W Linux: <code>dhcpd</code> (ISC) lub <code>dnsmasq</code>." },
    { q: "Co to MTU i jak diagnozować problemy?", a: "<span class='tip-badge tip-cmd'>CMD</span> MTU (Maximum Transmission Unit): domyślnie 1500 bajtów Ethernet. Jumbo frames: 9000 dla storage/HPC. Problemy: fragmentacja, black hole (PMTUD blocked). Test: <code>ping -M do -s 1472 host</code> (1472+28=1500). Sprawdź: <code>ip link show eth0 | grep mtu</code>. Ustaw: <code>ip link set eth0 mtu 9000</code>. VPN często wymaga niższego MTU (1450)." },
    { q: "Jak działa Anycast i do czego służy?", a: "Wiele serwerów z tym samym IP, routing BGP kieruje do najbliższego. Użycia: DNS (1.1.1.1, 8.8.8.8), CDN (CloudFront), DDoS mitigation. Klient widzi jeden IP, fizycznie trafił do najbliższego PoP. Linux: <code>ip route add 192.0.2.1/32 dev lo</code> + ogłoszenie przez BGP. Różni się od load balancing — decyzja na poziomie routingu, nie aplikacji." },
    { q: "Co to SSL/TLS termination i gdzie powinno być?", a: "Termination: szyfrowanie kończy się na load balancerze/proxy (nginx, HAProxy, AWS ALB). Backend dostaje plain HTTP. Passthrough: LB przekazuje zaszyfrowany ruch (L4). Re-encryption: LB terminuje i ponownie szyfruje do backendu (mTLS). <code>ssl_certificate</code> + <code>ssl_certificate_key</code> w Nginx. Staging certs: Let's Encrypt staging URL unika rate limits." }
  ]},

  { title: "LDAP / Autentykacja", cat: "Networking", qa: [
    { q: "Co to LDAP i jak działa autentykacja?", a: "Lightweight Directory Access Protocol. Drzewo DN: <code>uid=jan,ou=users,dc=firma,dc=pl</code>. Operacje: Bind (auth), Search, Add, Modify, Delete, Compare. Porty: 389 (LDAP), 636 (LDAPS/TLS), 3268 (Global Catalog). StartTLS upgrade plain do encrypted." },
    { q: "Jak skonfigurować SSSD dla LDAP/AD?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>/etc/sssd/sssd.conf</code>: <code>id_provider=ldap</code>, <code>auth_provider=ldap</code>, <code>ldap_uri</code>, <code>ldap_search_base</code>. Dla AD: <code>id_provider=ad</code> z <code>realm join</code>. <code>authselect select sssd</code>. Test: <code>id username</code>, <code>getent passwd username</code>." },
    { q: "Różnica LDAP vs Active Directory?", a: "AD = LDAP + Kerberos + DNS + Group Policy + Kerberos auth + replication. LDAP to protokół. AD używa LDAP jako protokołu dostępu. OpenLDAP: open-source implementacja protokołu. FreeIPA (Red Hat): LDAP + Kerberos + DNS + CA dla Linux środowisk." },
    { q: "Co to Kerberos i jak działa?", a: "Protokół autentykacji oparty na tickets. KDC (Key Distribution Center) = AS + TGS. Flow: user → AS (TGT) → TGS (service ticket) → service. SSO: jeden login, dostęp do wielu usług. AD używa Kerberos jako domyślnej metody. <code>kinit, klist, kdestroy</code>." }
  ]},

  { title: "Virtualization / KVM / VMware", cat: "Infra/IaC", qa: [
    { q: "Różnica Type 1 vs Type 2 hypervisor?", a: "Type 1 (bare-metal): VMware ESXi, Microsoft Hyper-V, KVM (w sensie jądra Linux) — bezpośrednio na hardware, mniejszy narzut. Type 2 (hosted): VirtualBox, VMware Workstation, Parallels — na OS hosta, większy narzut, dev-friendly." },
    { q: "Co to KVM i jak zarządzać maszynami?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>virsh list --all</code>. Start/stop: <code>virsh start/shutdown/destroy vm</code>. Utwórz: <code>virt-install --name test --memory 2048 --vcpus 2 --disk size=20 --os-variant rhel9 --cdrom rhel9.iso</code>. Clone: <code>virt-clone</code>. Snapshot: <code>virsh snapshot-create-as</code>." },
    { q: "VMware vSphere — kluczowe komponenty?", a: "ESXi (hypervisor host), vCenter Server (centralne zarządzanie), vSAN (hyperconverged storage), NSX (SDN), vMotion (live migration bez downtime), HA (restart VM po awarii hosta), DRS (load balancing VMów), FT (fault tolerance — zero downtime)." },
    { q: "Co to QEMU vs KVM?", a: "QEMU: pełny emulator sprzętu (CPU, RAM, urządzenia) w software — wolny. KVM: moduł jądra Linux wykorzystujący Intel VT-x/AMD-V do przyspieszenia — near-native performance. QEMU-KVM razem: QEMU emuluje urządzenia, KVM wykonuje kod gościa na fizycznym CPU." },
    { q: "Co to libvirt i jak z nim pracować?", a: "API i daemon (<code>libvirtd</code>) zarządzający hypervisorami (KVM, QEMU, Xen, VMware). Narzędzia: <code>virsh</code> (CLI), <code>virt-manager</code> (GUI), <code>virt-viewer</code>. XML definiuje domenę/sieć/storage. Ansible: moduł <code>community.libvirt</code>." },
    { q: "Jak działa migracja live (vMotion)?", a: "Pre-copy: kopiowanie pamięci iteracyjnie (dirty pages) → krótka przerwa → przełącz CPU + urządzenia. Wymaga: shared storage lub storage vMotion, sieć vMotion (dedykowana), VMkernel port. KVM odpowiednik: <code>virsh migrate --live vm qemu+ssh://dest</code>." }
  ]},

  { title: "Storage / SAN / LVM", cat: "Storage/HA", qa: [
    { q: "Różnica SAN vs NAS vs DAS?", a: "DAS (Direct-Attached Storage): bezpośrednio podłączony (SATA/SAS/NVMe). SAN (Storage Area Network): block storage przez sieć (iSCSI — TCP/IP, Fibre Channel — dedykowana) — wygląda jak lokalny dysk. NAS (Network Attached Storage): file storage przez sieć (NFS — Linux, CIFS/SMB — Windows). SAN = wydajność DB. NAS = shared files." },
    { q: "Co to LVM i jak działa?", a: "<span class='tip-badge tip-cmd'>CMD</span> PV (fizyczne dyski/partycje) → VG (pula przestrzeni) → LV (wolumin logiczny). <code>pvcreate /dev/sdb</code>. <code>vgcreate vg_data /dev/sdb</code>. <code>lvcreate -L 50G -n lv_app vg_data</code>. Rozszerz: <code>lvextend -L +10G /dev/vg_data/lv_app && resize2fs</code> (ext4) lub <code>xfs_growfs</code>." },
    { q: "iSCSI — jak skonfigurować?", a: "Target (serwer): <code>targetcli</code> — backstores, targets, LUNs, ACLs. Initiator (klient): discovery: <code>iscsiadm -m discovery -t sendtargets -p 192.168.1.10</code>. Login: <code>iscsiadm -m node --login</code>. Autentykacja CHAP. <code>iscsiadm -m session</code> sprawdza aktywne sesje." },
    { q: "Co to RAID i jakie poziomy znać?", a: "RAID 0: striping (wydajność, brak redundancji). RAID 1: mirror (50% pojemności). RAID 5: XOR parity, min 3 dyski, tolерuje 1 awarię. RAID 6: dual parity, 2 awarie. RAID 10: mirror + stripe, wydajne + bezpieczne. <code>mdadm --create /dev/md0 --level=5 --raid-devices=3 /dev/sd{b,c,d}</code>." },
    { q: "Co to Stratis storage (RHEL)?", a: "Warstwa abstrakcji nad LVM + XFS. Thin provisioning, snapshoty, szyfrowanie, monitoring. <code>stratis pool create mypool /dev/sdb</code>. <code>stratis filesystem create mypool myfs</code>. Mount: <code>stratisd</code> automatycznie zarządza. Prostszy niż LVM + XFS ręcznie." },
    { q: "Co to GlusterFS i Ceph?", a: "GlusterFS: distributed filesystem, POSIX-compliant, self-healing, no metadata server. Bricks → Volumes (distributed, replicated, striped). Ceph: unified storage (block/file/object), RADOS, erasure coding, używany w OpenStack/K8s. Bardziej złożony, ale skaluje masywnie." },
    { q: "Jak działają NFS i jak konfigurować?", a: "<span class='tip-badge tip-cmd'>CMD</span> Server: <code>/etc/exports: /data 192.168.1.0/24(rw,sync,no_root_squash)</code>. <code>exportfs -ra && systemctl restart nfs-server</code>. Klient: <code>mount -t nfs server:/data /mnt</code>. Trwałe w <code>/etc/fstab</code>. NFS4: Kerberos auth (<code>sec=krb5</code>), pseudoroot, brak rpcbind." }
  ]},

  { title: "High Availability / Klastry", cat: "Storage/HA", qa: [
    { q: "Co to Pacemaker / Corosync?", a: "Corosync: komunikacja klastrowa i membership (quorum). Pacemaker: resource manager (VIP, usługi, filesystem mounty). Razem = RHEL HA add-on. <code>pcs cluster setup --name myklaster node1 node2</code>. <code>pcs resource create VIP IPaddr2 ip=10.0.0.100</code>. Fencing (STONITH) wymagane." },
    { q: "Co to split-brain i jak zapobiegać?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Obie strony myślą że są primary → podwójny zapis → korupcja danych. Rozwiązania: quorum (większość węzłów), STONITH/fencing (zabij drugą stronę — IPMI/iLO/fence_aws), witness/tiebreaker (trzeci mały węzeł lub SBD — storage-based death)." },
    { q: "Co to keepalived i jak działa?", a: "VRRP (Virtual Router Redundancy Protocol) — wirtualny IP failover. Master trzyma VIP, Backup przejmuje przy awarii (brak heartbeat). <code>/etc/keepalived/keepalived.conf</code>: <code>vrrp_instance VI_1 { state MASTER, priority 100, virtual_ipaddress { 10.0.0.100 } }</code>. Często z HAProxy." },
    { q: "Jak działa HAProxy?", a: "L4/L7 load balancer i proxy. Frontend (accepts connections) → Backend (servers). Algorytmy: roundrobin, leastconn, source (sticky sessions). Health checks. Stats page. <code>/etc/haproxy/haproxy.cfg</code>. SSL termination. ACL-based routing." },
    { q: "Co to active-active vs active-passive HA?", a: "Active-passive: standby czeka, przejmuje przy awarii (VIP migration). Prostsze, waste zasobów. Active-active: oba węzły obsługują ruch (LB między nimi). Efektywniejsze, ale wymaga shared state lub sticky sessions. Bazy danych: częściej A-P lub multi-master (Galera, Patroni)." },
    { q: "Co to RPO i RTO w kontekście HA?", a: "RTO (Recovery Time Objective): jak długo może trwać przerwa? RPO (Recovery Point Objective): ile danych można stracić? HA minimalizuje RTO (sekundy). DR (disaster recovery) adresuje RPO (backup interwał) i obejmuje kolejny site/region." }
  ]},

  { title: "Docker — Kontenery", cat: "Containers", qa: [
    { q: "Różnica między image a container?", a: "Image = read-only template (warstwy UnionFS — każdy RUN/COPY tworzy warstwę). Container = uruchomiona instancja z dodatkową zapisywalną warstwą (ephemeral). Image → <code>docker run</code> → container. <code>docker commit</code> utrwala zmiany (antypattern)." },
    { q: "Dockerfile — kluczowe dyrektywy?", a: "<code>FROM</code> (base image), <code>RUN</code> (budowanie), <code>COPY/ADD</code> (pliki), <code>ENV</code> (zmienne), <code>EXPOSE</code> (dokumentacja portu), <code>ENTRYPOINT</code> (główna komenda), <code>CMD</code> (domyślne args), <code>WORKDIR</code>, <code>USER</code>, <code>HEALTHCHECK</code>, <code>ARG</code>." },
    { q: "Co to multi-stage build?", a: "<span class='tip-badge tip-info'>INFO</span> Kilka bloków <code>FROM</code> w jednym Dockerfile. Stage budowania (z kompilatorem) → kopiowanie tylko artefaktów do małego runtime image (<code>COPY --from=builder /app/bin /app/bin</code>). Drastycznie redukuje rozmiar obrazu i powierzchnię ataku." },
    { q: "Jak działają sieci Docker?", a: "<span class='tip-badge tip-cmd'>CMD</span> Typy: <code>bridge</code> (default, NAT — kontenery izolowane od hosta), <code>host</code> (kontener używa sieci hosta bezpośrednio), <code>none</code> (brak sieci), <code>overlay</code> (Swarm/multi-host), <code>macvlan</code> (kontener jako osobne urządzenie w sieci). Kontenery w tej samej sieci rozwiązują się po nazwie (wbudowany DNS). Listuj: <code>docker network ls</code>. Szczegóły: <code>docker network inspect mynet</code>. Utwórz: <code>docker network create --driver bridge mynet</code>. Utwórz z własną podsiecią: <code>docker network create --subnet 192.168.10.0/24 --gateway 192.168.10.1 mynet</code>. Podłącz kontener: <code>docker network connect mynet kontener</code>. Odłącz: <code>docker network disconnect mynet kontener</code>. Usuń: <code>docker network rm mynet</code>. Uruchom w sieci: <code>docker run --network mynet --name web nginx</code>. Sprawdź IP kontenera: <code>docker inspect kontener | grep IPAddress</code>. Usuń nieużywane sieci: <code>docker network prune</code>." },
    { q: "Volumes vs bind mounts vs tmpfs?", a: "Volume: zarządzany przez Docker (<code>/var/lib/docker/volumes</code>), backup-friendly, przenośny. Bind mount: konkretna ścieżka hosta, dev-friendly. tmpfs: in-memory, dane znikają po zatrzymaniu (sekrety). <code>-v vol:/data</code>, <code>-v /host:/container</code>, <code>--tmpfs /tmp</code>." },
    { q: "Jak zabezpieczać kontenery Docker?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Uruchamiaj jako non-root (<code>USER appuser</code>). <code>--read-only</code>. <code>--cap-drop ALL --cap-add NET_BIND_SERVICE</code>. <code>--security-opt no-new-privileges</code>. Skanowanie: <code>docker scout</code>, Trivy, Snyk. Użyj distroless/scratch jako base." },
    { q: "Co to docker-compose i kiedy używać?", a: "Definiowanie wielokontenerowych aplikacji (YAML). <code>docker compose up -d</code>. Services, networks, volumes jako kod. Dev/testing. Produkcja: Kubernetes lub Docker Swarm. V2 (compose plugin) zastąpił standalone <code>docker-compose</code>." },
    { q: "Jak monitorować i debugować kontenery?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>docker logs -f container</code>. Stats: <code>docker stats</code>. Exec: <code>docker exec -it container bash</code>. Inspect: <code>docker inspect container</code>. Events: <code>docker events</code>. Top: <code>docker top container</code>. <code>nsenter</code> dla głębszej diagnostyki." },
    { q: "Co to container registry?", a: "Docker Hub (publiczny), GHCR (GitHub), ECR (AWS), ACR (Azure), GCR (Google), Harbor (self-hosted). <code>docker tag myapp:1.0 registry/myapp:1.0 && docker push registry/myapp:1.0</code>. Image scanning wbudowany w ECR, Harbor." },
    { q: "Czym różni się Podman od Docker?", a: "Podman: daemonless (brak docker daemon), rootless kontenery natively, kompatybilny z Docker CLI (<code>alias docker=podman</code>). Bezpieczniejszy w RHEL/Fedora. <code>podman generate systemd</code> dla autostartu. Compose: <code>podman-compose</code>." },
    { q: "Jak zoptymalizować rozmiar obrazu Docker?", a: "<span class='tip-badge tip-info'>INFO</span> Multi-stage build (kopiuj tylko artefakty). Użyj <code>alpine</code> lub <code>distroless</code> jako base. Łącz RUN w jedną warstwę: <code>RUN apt-get update && apt-get install -y pkg && rm -rf /var/lib/apt/lists/*</code>. <code>.dockerignore</code> wyklucz zbędne pliki. <code>docker image history img</code> pokazuje warstwy. Narzędzie: <code>dive</code> do analizy warstw." },
    { q: "Jak działają Docker health checks?", a: "<code>HEALTHCHECK --interval=30s --timeout=5s --retries=3 CMD curl -f http://localhost:8080/health || exit 1</code>. Stany: starting → healthy/unhealthy. <code>docker inspect container | jq '.[].State.Health'</code>. Docker Compose: <code>healthcheck: test: ['CMD', 'curl', '-f', 'http://localhost']</code>. K8s ignoruje HEALTHCHECK — używa własnych probe." },
    { q: "Co to Docker BuildKit i jakie daje możliwości?", a: "<span class='tip-badge tip-cmd'>CMD</span> BuildKit: nowy silnik budowania. Włącz: <code>DOCKER_BUILDKIT=1</code> lub domyślnie w Docker 23+. Możliwości: cache mount (<code>RUN --mount=type=cache,target=/root/.m2</code>), secret mount (<code>--mount=type=secret,id=mysecret</code>), równoległe etapy multi-stage, lepsza cache. <code>docker buildx build --platform linux/amd64,linux/arm64 -t img .</code> dla multi-arch." }
  ]},

  { title: "Docker — Zaawansowane Techniki", cat: "Containers", qa: [
    { q: "Jak optymalizować rozmiar obrazu Docker?", a: "<span class='tip-badge tip-info'>INFO</span> Multi-stage build: oddziel stage budowania od runtime. Łącz RUN: <code>RUN apt-get update && apt-get install -y pkg && rm -rf /var/lib/apt/lists/*</code>. Base images: alpine (5MB), distroless, scratch. <code>.dockerignore</code>: wyklucz node_modules, .git, tests. Sprawdź warstwy: <code>docker history image</code> lub narzędzie <code>dive</code>. BuildKit cache mounts: <code>--mount=type=cache,target=/root/.npm</code>." },
    { q: "Jak debugować kontener crashujący przy starcie?", a: "<span class='tip-badge tip-cmd'>CMD</span> Override entrypoint: <code>docker run --entrypoint /bin/sh -it image</code>. Logi zatrzymanego: <code>docker logs $(docker ps -lq)</code>. Exit code: <code>docker inspect container --format '{{.State.ExitCode}}'</code>. Poprzedni restart: <code>docker logs container --since=10m</code>. Interaktywny strace: <code>docker run --cap-add SYS_PTRACE image strace ./app</code>. Events: <code>docker events --filter type=container</code>." },
    { q: "Co to Docker BuildKit i cache mounts?", a: "BuildKit (domyślny od Docker 23): <code># syntax=docker/dockerfile:1</code>. Cache mount: <code>RUN --mount=type=cache,target=/root/.npm npm install</code> — cache między buildami bez trafienia do warstw. Secret mount: <code>RUN --mount=type=secret,id=npmrc cat /run/secrets/npmrc</code> — sekrety nie wchodzą do image. <code>docker buildx build --cache-from type=registry,ref=image:cache --cache-to type=inline .</code>" },
    { q: "Jak zarządzać Docker registry (Harbor)?", a: "Harbor: enterprise self-hosted OCI registry. Funkcje: RBAC, vulnerability scanning (Trivy wbudowany), image signing, replication, proxy cache. Deploy: Helm chart lub docker-compose. Pull-through cache: <code>docker pull harbor.firma.pl/proxy/docker.io/nginx</code>. Robot accounts dla CI/CD. Retencja: automatyczne usuwanie starych tagów. Cosign integration dla supply chain security." },
    { q: "Jak skanować obrazy Docker pod kątem CVE?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Trivy: <code>trivy image nginx:latest</code>. Grype: <code>grype nginx:latest</code>. Docker Scout: <code>docker scout cves image</code>. Snyk: <code>snyk container test image</code>. Integruj w CI: fail build jeśli CRITICAL CVE. SBOM: <code>trivy image --format cyclonedx nginx > sbom.json</code>. Base image updates: Dependabot dla Dockerfile, Renovate bot." }
  ]},

  { title: "Kubernetes / OpenShift", cat: "Containers", qa: [
