    { q: "Kluczowe obiekty Kubernetes?", a: "Pod (najmniejsza jednostka), Deployment (bezstanowy), StatefulSet (stanowy), DaemonSet (per-node), Service (ClusterIP/NodePort/LoadBalancer), Ingress, ConfigMap, Secret, PV/PVC (PersistentVolume/Claim), Namespace, ServiceAccount, HPA (Horizontal Pod Autoscaler), NetworkPolicy." },
    { q: "Różnica Deployment vs StatefulSet vs DaemonSet?", a: "<span class='tip-badge tip-info'>INFO</span> Deployment: bezstanowe, losowe nazwy podów, skalowalne. StatefulSet: stabilna tożsamość (<code>app-0, app-1</code>), stały storage, ordered rolling update (DB, Kafka). DaemonSet: jeden pod per node (Prometheus node_exporter, Fluentd, kube-proxy)." },
    { q: "Jak działa RBAC w K8s?", a: "Subjects (User/Group/ServiceAccount) → (Cluster)RoleBinding → (Cluster)Role → Rules (verbs + resources). <code>kubectl auth can-i list pods --as jan</code>. Zasada: minimalnych uprawnień. ServiceAccount dla aplikacji, nigdy default SA." },
    { q: "Co to liveness vs readiness vs startup probe?", a: "Liveness: czy kontener żyje → restart jeśli fail. Readiness: czy może przyjmować ruch → usuwa z Service endpoints. Startup probe: czas na start wolnej aplikacji (zanim zadziała liveness). Types: httpGet, tcpSocket, exec." },
    { q: "Jak działa Kubernetes networking?", a: "Każdy Pod dostaje unikalne IP (CNI — Container Network Interface: Calico, Flannel, Cilium). Pod-to-Pod routing bez NAT. Service = stabilny IP/DNS + load balance do podów (kube-proxy/eBPF). Ingress = HTTP/HTTPS zewnętrzny dostęp z routingiem." },
    { q: "Co to Helm i jak używać?", a: "<span class='tip-badge tip-cmd'>CMD</span> Package manager dla K8s. Chart = paczka YAML templates + values.yaml. <code>helm repo add stable https://charts.helm.sh/stable</code>. <code>helm install myapp ./chart -f custom-values.yaml</code>. <code>helm upgrade/rollback/uninstall</code>. <code>helm template</code> do debugowania." },
    { q: "Co to OpenShift vs Kubernetes?", a: "OpenShift = Kubernetes + enterprise: Routes (Ingress), SCC (Security Context Constraints zamiast PSP), wbudowany Registry, CI/CD (Tekton/ArgoCD), OAuth, rozszerzony RBAC. <code>oc</code> = rozszerzenie kubectl. Bazuje na OKD (community upstream)." },
    { q: "Jak działa HPA (Horizontal Pod Autoscaler)?", a: "Skaluje repliki na podstawie metryk (CPU, pamięć, custom via Prometheus Adapter). <code>kubectl autoscale deployment app --cpu-percent=70 --min=2 --max=10</code>. Wymaga metrics-server. VPA (Vertical Pod Autoscaler) dostosowuje resources requests. KEDA (Kubernetes Event-Driven Autoscaling) dla event-driven scaling." },
    { q: "Co to Persistent Volume i Storage Classes?", a: "PV (PersistentVolume): zasób klastra (dysk). PVC (PersistentVolumeClaim): żądanie zasobu przez pod. StorageClass: dynamiczne provisionowanie (<code>aws-ebs, azure-disk, csi-driver</code>). Access modes: ReadWriteOnce, ReadOnlyMany, ReadWriteMany. Reclaim policy: Retain/Delete/Recycle." },
    { q: "Jak debugować problemy w K8s?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>kubectl describe pod nazwa</code>. Logi: <code>kubectl logs pod -c container --previous</code>. Exec: <code>kubectl exec -it pod -- bash</code>. Port-forward: <code>kubectl port-forward svc/app 8080:80</code>. Events: <code>kubectl get events --sort-by=.lastTimestamp</code>." },
    { q: "Co to NetworkPolicy?", a: "Firewall na poziomie podów. Domyślnie brak izolacji — wszystkie pody mogą się komunikować. NetworkPolicy z podSelector, namespaceSelector ogranicza ingress/egress. Wymaga CNI z obsługą (Calico, Cilium). Zero-trust: deny-all + whitelist." },
    { q: "Co to ArgoCD / Flux?", a: "GitOps tools — synchronizują stan klastra z repozytorium Git. ArgoCD: GUI + webhooks + multi-cluster. Flux: cloud-native, Helm+Kustomize integration. Zasada GitOps: Git = single source of truth. CD pipeline: push do Git → automatyczny deploy." },
    { q: "Jak skonfigurować Ingress z TLS w K8s?", a: "<span class='tip-badge tip-cmd'>CMD</span> cert-manager + Let's Encrypt: <code>kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.yaml</code>. ClusterIssuer z ACME. Ingress annotation: <code>cert-manager.io/cluster-issuer: letsencrypt-prod</code> + sekcja <code>tls:</code>. Ręcznie: Secret z <code>tls.crt</code> i <code>tls.key</code> + Ingress z <code>spec.tls</code>." },
    { q: "Co to Kubernetes Operator i jak go zbudować?", a: "Operator = CRD + Controller (pętla reconciliation). Kubebuilder: <code>kubebuilder init --domain example.com</code> + <code>kubebuilder create api --group app --version v1 --kind MyApp</code>. Operator SDK (Go/Ansible/Helm). Reconcile loop: <code>func (r *MyAppReconciler) Reconcile(ctx, req)</code> — porównaj desired vs actual, koryguj. Publish: OLM (Operator Lifecycle Manager)." },
    { q: "Jak monitorować klaster K8s?", a: "Prometheus + Grafana (kube-prometheus-stack): metryki node, poda, API server. <code>kubectl top nodes/pods</code>. kube-state-metrics: metryki Kubernetes objects. Alerting: reguły dla PodCrashLooping, NodeNotReady, HighMemoryUsage. Logi: Loki lub EFK stack (Elasticsearch+Fluentd+Kibana). Traces: Jaeger/Tempo z OpenTelemetry." }
  ]},

  { title: "Kubernetes — Mid Level", cat: "Containers", qa: [
    { q: "Jak działa garbage collection w K8s i co to finalizers?", a: "<span class='tip-badge tip-info'>INFO</span> Garbage collector usuwa orphaned objects (np. ReplicaSet po usunięciu Deployment). <code>ownerReferences</code> definiuje zależności. Finalizers: blokują usunięcie obiektu do czasu wykonania cleanup (np. <code>kubernetes.io/pvc-protection</code>). <code>kubectl patch ... -p '{\"metadata\":{\"finalizers\":[]}}' </code> — force remove." },
    { q: "Co to Admission Controllers i jak działają?", a: "Interceptują żądania do API po autentykacji i autoryzacji. Mutating: modyfikują (np. inject sidecar, defaultValues). Validating: akceptują/odrzucają. Wbudowane: NamespaceLifecycle, LimitRanger, ResourceQuota, PodSecurity. Custom: Webhooks (MutatingWebhookConfiguration). OPA (Open Policy Agent)/Gatekeeper = policy engine na webhookach." },
    { q: "Jak działa RBAC w praktyce — typowe błędy?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Typowe błędy: nadawanie ClusterRole zamiast Role (za szerokie uprawnienia), używanie default ServiceAccount (ma często za dużo uprawnień), brak <code>automountServiceAccountToken: false</code>. Debug: <code>kubectl auth can-i --list --as system:serviceaccount:ns:sa</code>. Audit log: sprawdź forbidden errors." },
    { q: "Jak diagnozować OOMKilled pod?", a: "<code>kubectl describe pod nazwa</code> — szukaj <code>OOMKilled</code> w Last State. <code>kubectl top pod nazwa</code> — zużycie pamięci. Sprawdź czy limit jest za niski vs rzeczywiste zużycie. <code>dmesg | grep -i oom</code> na node. Rozwiązanie: zwiększ memory limit lub znajdź memory leak w aplikacji. <code>kubectl get events</code>." },
    { q: "Co to Cluster Autoscaler vs KEDA?", a: "Cluster Autoscaler: skaluje nodes (dodaje/usuwa VM gdy pody są Pending lub node idle). KEDA (Kubernetes Event-Driven Autoscaling): skaluje pody na podstawie zewnętrznych metryk (długość kolejki Kafka/SQS, custom metrics). Razem: KEDA skaluje pody → CA skaluje nodes. Działa z HPA." },
    { q: "Jak działa ConfigMap i Secret — różnice i bezpieczeństwo?", a: "ConfigMap: nieszyfrowane dane konfiguracyjne. Secret: base64 (nie szyfrowanie!). <span class='tip-badge tip-warn'>WAŻNE</span> Secrets w etcd są nieszyfrowane domyślnie — włącz encryption at rest (<code>EncryptionConfiguration</code>). Lepiej: Vault Agent Injector lub External Secrets Operator (ESO) z AWS Secrets Manager/Azure Key Vault. <code>--from-env-file</code> dla wielu zmiennych." },
    { q: "Co to Pod Security Standards (PSS)?", a: "Zastąpił PodSecurityPolicy (deprecated K8s 1.21, usunięty 1.25). Trzy profile: Privileged (brak restrykcji), Baseline (minimalne zabezpieczenia), Restricted (hardened). Enforcement przez labels na namespace: <code>pod-security.kubernetes.io/enforce: restricted</code>. Modes: enforce, audit, warn." },
    { q: "Jak debugować networking w K8s?", a: "<span class='tip-badge tip-cmd'>CMD</span> Test connectivity: <code>kubectl run debug --image=nicolaka/netshoot -it --rm</code>. DNS: <code>nslookup svc-name.namespace</code>. <code>curl -v http://svc:port</code>. Sprawdź endpoints: <code>kubectl get endpoints svc-name</code>. NetworkPolicy blokuje? <code>kubectl describe networkpolicy</code>. CNI logi: <code>journalctl -u kubelet</code>." },
    { q: "Co to Vertical Pod Autoscaler (VPA) i kiedy używać?", a: "VPA automatycznie dostosowuje CPU/memory requests na podstawie historycznego zużycia. Tryby: Off (tylko rekomendacje), Initial (ustawia przy tworzeniu poda), Auto (restartuje pody z nowymi wartościami). Nie łącz VPA z HPA na CPU/memory — konflikt. Używaj VPA dla stateful apps, HPA dla stateless." },
    { q: "Jak działają Kubernetes API aggregation i extensions?", a: "API Aggregation: dodaj własne API groups przez APIService resource + własny serwer. CRD (Custom Resource Definition): prostsze, bez własnego serwera, dane w etcd (rozproszony key-value store będący bazą danych Kubernetes). Webhook conversion: migracja wersji CRD. <code>kubectl api-resources</code> lista wszystkich. <code>kubectl explain crd.spec</code>." },
    { q: "Jak zrobić canary deployment w K8s?", a: "Metoda 1: dwa Deployments (stable + canary) z jednym Service — proporcja przez repliki. Metoda 2: Ingress annotations (Nginx: <code>nginx.ingress.kubernetes.io/canary: 'true'</code>, <code>canary-weight: '20'</code>). Metoda 3: Service Mesh (Istio VirtualService — dokładna kontrola %). Argo Rollouts: dedykowane narzędzie z automatycznym rollback." },
    { q: "Co to resource quota i LimitRange?", a: "ResourceQuota: limit zasobów per namespace (CPU, memory, liczba podów/services/PVC). LimitRange: domyślne i maksymalne requests/limits per container/pod — zapobiega kontenerom bez limitów. <code>kubectl describe resourcequota -n namespace</code>. Jeśli brak miejsca: <code>kubectl get events | grep FailedCreate</code>." }
  ]},

  { title: "Kubernetes — Zaawansowane", cat: "Containers", qa: [
    { q: "Co to Operator Pattern w K8s?", a: "<span class='tip-badge tip-info'>INFO</span> Custom Controller + CRD (Custom Resource Definition). Koduje wiedzę operacyjną jako kod (jak deploy, backup, failover). Przykłady: Prometheus Operator, PostgreSQL Operator (Zalando), cert-manager. Framework: Operator SDK, Kubebuilder. <code>kubectl get crd</code>." },
    { q: "Co to Resource Requests i Limits?", a: "Request: minimalna gwarancja zasobów (scheduler używa do placement). Limit: maksimum (CPU throttling, Memory → OOMKill). <span class='tip-badge tip-warn'>WAŻNE</span> QoS classes: Guaranteed (req=limit), Burstable (req<limit), BestEffort (brak req/limit — pierwsze do wyrzucenia przy presji)." },
    { q: "Jak działa Kubernetes scheduler?", a: "Filtering (predykaty): które node'y mogą uruchomić pod (resources, taints, nodeSelector, affinity). Scoring (priorytety): który node jest najlepszy. Binding: przypisanie pod → node. Custom schedulers możliwe. <code>nodeName</code> bypass schedulera." },
    { q: "Co to Taints i Tolerations?", a: "<code>kubectl taint nodes node1 gpu=true:NoSchedule</code> — żaden pod bez toleracji nie trafi na ten node. Pod toleration: <code>tolerations: [{key: gpu, value: true, effect: NoSchedule}]</code>. Effects: NoSchedule, PreferNoSchedule, NoExecute (eksmituje istniejące pody)." },
    { q: "Co to Node Affinity i Pod Affinity?", a: "NodeAffinity: reguły gdzie pod może wylądować (requiredDuringScheduling = twarde, preferredDuringScheduling = miękkie). PodAffinity: umieść obok konkretnych podów (np. cache blisko app). PodAntiAffinity: rozsiej pody po różnych node'ach (HA)." },
    { q: "Co to Ingress Controller i jak działa?", a: "Ingress Controller (Nginx, Traefik, HAProxy, AWS ALB) obsługuje reguły Ingress. Ingress Resource: routing HTTP/HTTPS per hostname/path → Service. TLS termination. <code>kubectl get ingress</code>. Annotations dla zaawansowanej konfiguracji (rate-limit, auth, rewrite)." },
    { q: "Co to Service Mesh (Istio / Linkerd)?", a: "Sidecar proxy (Envoy) przy każdym podzie. Zapewnia: mTLS (szyfrowanie między serwisami), traffic management (A/B, canary, retries, timeouts), observability (traces, metrics bez zmian w kodzie). Istio: potężny, złożony. Linkerd: prostszy, mniejszy overhead." },
    { q: "Jak działają Init Containers?", a: "Uruchamiają się przed głównymi kontenerami poda, muszą zakończyć się sukcesem. Użycia: czekaj na gotowość DB (<code>until pg_isready</code>), klonuj repo, inicjalizuj config. Mają dostęp do tych samych volumes co główne kontenery. Uruchamiają się sekwencyjnie." },
    { q: "Co to Kustomize?", a: "Wbudowany w kubectl (od 1.14) tool do zarządzania konfiguracją bez template engine. <code>kustomization.yaml</code>: resources, patches, namePrefix, commonLabels. Overlays dla środowisk (base + prod/staging). <code>kubectl apply -k ./overlay/prod</code>. Alternatywa dla Helm (bez template engine)." },
    { q: "Co to etcd i dlaczego jest krytyczny?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Rozproszony key-value store — serce klastra K8s. Przechowuje cały stan klastra. RAFT consensus protocol. Backup: <code>etcdctl snapshot save backup.db</code>. Restore: <code>etcdctl snapshot restore</code>. HA: nieparzysta liczba członków (3, 5). Utrata etcd = utrata klastra." },
    { q: "Jak działa rolling update i rollback?", a: "<code>kubectl set image deployment/app app=image:v2</code>. Strategia: <code>RollingUpdate</code> (maxUnavailable, maxSurge), <code>Recreate</code> (downtime). Historia: <code>kubectl rollout history deployment/app</code>. Rollback: <code>kubectl rollout undo deployment/app --to-revision=2</code>. Pause/resume rolling update." },
    { q: "Co to Pod Disruption Budget (PDB)?", a: "Gwarantuje minimalną dostępność podczas voluntary disruptions (drain, rolling update). <code>minAvailable: 2</code> lub <code>maxUnavailable: 1</code>. <code>kubectl drain node1 --ignore-daemonsets</code> respektuje PDB. Chroni przed przypadkowym downtime podczas maintenance." }
  ]},

  { title: "Kubernetes — Operator & GitOps", cat: "Containers", qa: [
    { q: "Jak napisać prosty Kubernetes Operator?", a: "<span class='tip-badge tip-info'>INFO</span> Operator SDK (Go): <code>operator-sdk init --domain firma.pl --repo github.com/firma/op</code>. Stwórz API: <code>operator-sdk create api --group app --version v1 --kind MyApp</code>. Reconcile loop: sprawdź desired state (CR) vs actual state → utwórz/zaktualizuj/usuń zasoby. <code>controller-runtime</code>: <code>ctrl.SetupWithManager(mgr).For(&apiv1.MyApp{}).Owns(&appsv1.Deployment{}).Complete(r)</code>. Kubebuilder alternatywa." },
    { q: "Co to FluxCD i jak różni się od ArgoCD?", a: "Flux: cloud-native, GitOps toolkit (Source Controller, Kustomize Controller, Helm Controller). CLI: <code>flux bootstrap github --owner=org --repository=fleet-infra</code>. Image Automation: automatyczna aktualizacja tagów w repo. Różnice od ArgoCD: Flux bardziej composable (każdy kontroler osobno), brak wbudowanego GUI (osobna instalacja), lepszy Helm support. ArgoCD: lepszy UI, multi-cluster management." },
    { q: "Jak zarządzać sekretami w GitOps (Sealed Secrets / ESO)?", a: "Sealed Secrets: <code>kubeseal --fetch-cert > pub.crt && echo 'mypass' | kubeseal --raw --from-file=/dev/stdin --scope cluster-wide --cert pub.crt</code>. SealedSecret resource w Git → kontroler deszyfruje w klastrze. External Secrets Operator: CR <code>ExternalSecret</code> pobiera z AWS Secrets Manager/Vault/Azure Key Vault. ESO lepsze dla wielu klastrów. <code>SecretStore</code> definiuje backend." },
    { q: "Co to Kustomize overlays i jak strukturyzować?", a: "<code>base/</code>: deployment.yaml, service.yaml, <code>kustomization.yaml: resources: [deployment.yaml]</code>. Overlays: <code>overlays/prod/kustomization.yaml: bases: [../../base]\npatchesStrategicMerge: [replica-patch.yaml]\nconfigMapGenerator: [{name: config, files: [config.properties]}]</code>. <code>kubectl diff -k overlays/prod</code>. <code>kubectl apply -k overlays/prod</code>. Komponenty (reusable across overlays): <code>kind: Component</code>." },
    { q: "Jak debugować CrashLoopBackOff?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>kubectl describe pod nazwa -n ns</code> → Events section. <code>kubectl logs pod -c container --previous</code> — logi poprzedniej instancji. Sprawdź exit code w <code>Last State</code>. Common causes: błędna konfiguracja (brak env), brak pliku (błędny mount), OOM (zbyt mały limit), błąd aplikacji (sprawdź logi), liveness probe zbyt agresywna. <code>kubectl debug pod --copy-to=debug-pod --image=busybox</code>." }
  ]},

  { title: "Ansible — Automatyzacja", cat: "Infra/IaC", qa: [
    { q: "Jak działa Ansible i co to idempotentność?", a: "Agentless — łączy przez SSH (WinRM dla Windows). Playbooki w YAML. <span class='tip-badge tip-info'>INFO</span> Idempotentność = wielokrotne uruchomienie daje ten sam efekt (<code>state: present</code> nie tworzy ponownie jeśli istnieje)." },
    { q: "Struktura roli Ansible?", a: "<code>roles/nazwa/{tasks,handlers,vars,defaults,templates,files,meta}/main.yml</code>. Wywołanie: sekcja <code>roles:</code> w playbooku. Galaxy: <code>ansible-galaxy role install geerlingguy.nginx</code>. Init nowej roli: <code>ansible-galaxy role init moja_rola</code>." },
    { q: "Priorytety zmiennych (od najniższego)?", a: "defaults → inventory vars → group_vars/all → group_vars → host_vars → play vars → task vars → set_fact → extra vars (<code>-e</code>). <span class='tip-badge tip-warn'>WAŻNE</span> Extra vars mają najwyższy priorytet i nadpisują wszystko. Pełna lista: 22 poziomy." },
    { q: "Co to Ansible Vault?", a: "<span class='tip-badge tip-cmd'>CMD</span> Szyfrowanie AES-256. <code>ansible-vault create secrets.yml</code>. Szyfruj string: <code>ansible-vault encrypt_string 'tajne' --name 'db_pass'</code>. Uruchomienie: <code>ansible-playbook site.yml --ask-vault-pass</code>. Plik z hasłem: <code>--vault-password-file ~/.vault_pass</code>." },
    { q: "Jak działają handlery?", a: "Handlery wywoływane przez <code>notify:</code> — uruchamiane raz na końcu play, niezależnie ile razy notify. Przykład: task instaluje nginx → notify: restart nginx → handler wykonuje restart. <code>meta: flush_handlers</code> wymusza wcześniejsze wykonanie." },
    { q: "Co to Jinja2 w Ansible?", a: "Silnik szablonów. W templates (j2 files): <code>{{ var }}</code>, <code>{% if condition %}</code>, <code>{% for item in list %}</code>. Filtry: <code>{{ var | default('val') }}</code>, <code>{{ list | join(',') }}</code>, <code>{{ path | basename }}</code>. Moduł template: <code>src: nginx.conf.j2</code>." },
    { q: "Jak debugować playbook?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>-v/-vvv/-vvvv</code> dla verbosity. <code>debug: msg='{{ var }}'</code>. <code>--check</code> dry-run. <code>--diff</code> pokazuje zmiany. <code>--start-at-task 'nazwa zadania'</code>. <code>--tags/--skip-tags</code>. <code>--limit hostname</code>. <code>ansible-lint playbook.yml</code>." },
    { q: "Co to Ansible Collections?", a: "Paczki ról, modułów, pluginów. Namespace: <code>community.general</code>, <code>ansible.posix</code>. Instalacja: <code>ansible-galaxy collection install community.docker</code>. Plik zależności: <code>requirements.yml</code>. Zastąpiły 'loose roles' jako standard dystrybucji." },
    { q: "Jak używać modułu template vs copy?", a: "<code>template</code>: przetwarza Jinja2, dynamiczna zawartość (np. nginx.conf z zmiennymi). <code>copy</code>: kopiuje statyczny plik, brak przetwarzania Jinja. <code>lineinfile</code>: modyfikuje konkretną linię. <code>blockinfile</code>: wstawia blok tekstu." },
    { q: "Co to Ansible Tower / AWX?", a: "AWX (Ansible Web eXecutor) = open-source. Tower = enterprise (teraz AAP — Ansible Automation Platform). GUI + REST API + RBAC + job scheduling + webhooks + credential management. Inventory jako kod lub dynamiczne. Integracja z Vault, SCM (Git). Alternatywa: Ansible Semaphore (lżejszy)." },
    { q: "Jak zarządzać inventory dynamicznym?", a: "Dynamic inventory: skrypt lub plugin zwracający JSON. <code>ansible-inventory --list</code>. Pluginy AWS: <code>aws_ec2</code>, VMware: <code>vmware_vm_inventory</code>. Konfiguracja w <code>inventory.yml</code> z odpowiednim pluginem i filtrami." },
    { q: "Jak skonfigurować load balancer przez Ansible?", a: "<span class='tip-badge tip-cmd'>CMD</span> HAProxy: moduł <code>ansible.builtin.template</code> dla haproxy.cfg + <code>ansible.builtin.service</code>. Nginx: <code>community.general.nginx</code> lub template z upstream block. AWS ALB: <code>community.aws.elb_application_lb</code>. Przykład HAProxy: <code>- name: configure haproxy\n  template:\n    src: haproxy.cfg.j2\n    dest: /etc/haproxy/haproxy.cfg\n  notify: restart haproxy</code>. Balancing group: użyj zmiennych <code>group_vars/lb</code>." },
    { q: "Jak zarządzać pakietami przez Ansible na wielu dystrybucjach?", a: "Moduł <code>ansible.builtin.package</code> (abstrakcja nad dnf/apt/yum). Lub per-distro: <code>when: ansible_os_family == 'RedHat'</code>. Elegancko: <code>vars_files: ['vars/{{ ansible_os_family }}.yml']</code> z mapą package names. <code>package_facts</code> moduł sprawdza zainstalowane pakiety." },
    { q: "Co to ansible-navigator i jak różni się od ansible-playbook?", a: "<span class='tip-badge tip-info'>INFO</span> ansible-navigator: nowe narzędzie oparte na EE (Execution Environments — kontenery z Ansiblem i kolekcjami). Zastępuje ansible-playbook w AWX/AAP (Ansible Automation Platform). <code>ansible-navigator run playbook.yml --mode stdout</code>. EE = kontener Docker z Ansiblem + kolekcjami + zależnościami. Buduj: <code>ansible-builder build</code>. Zapewnia powtarzalność środowiska." }
  ]},

  { title: "Ansible / Terraform — Mid Level", cat: "Infra/IaC", qa: [
    { q: "Jak działa Ansible fact caching i kiedy używać?", a: "<span class='tip-badge tip-info'>INFO</span> Facts zbierane przy każdym play (gather_facts: yes) — kosztowne przy dużej inwentaryzacji. Cache: <code>fact_caching = redis</code> lub <code>jsonfile</code> w ansible.cfg. <code>fact_caching_timeout = 3600</code>. Odśwież: <code>--flush-cache</code>. Custom facts: <code>/etc/ansible/facts.d/*.fact</code> (JSON/INI) dostępne jako <code>ansible_local</code>." },
    { q: "Co to Ansible molecule i jak testować role?", a: "Framework do testowania ról Ansible. Workflow: <code>molecule init role myrole</code> → definiuj scenariusze (Docker/Vagrant/EC2) → <code>molecule test</code> (create + converge + verify + destroy). Verifier: Testinfra (Python) lub Ansible verify. CI integration: uruchamiaj molecule w pipeline przy każdym PR." },
    { q: "Jak optymalizować wydajność Ansible dla dużych inwentaryzacji?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>forks = 50</code> (domyślnie 5). <code>pipelining = True</code> (mniej połączeń SSH). <code>ssh_args = -o ControlMaster=auto -o ControlPersist=60s</code>. <code>strategy: free</code> (nie czeka na wolniejsze hosty). <code>gather_facts: no</code> gdzie zbędne + fact cache. <code>--limit</code> dla podzbioru. Mitogen strategy plugin: 7x szybszy." },
    { q: "Jak działa Ansible error handling?", a: "<code>ignore_errors: yes</code> — kontynuuj mimo błędu. <code>failed_when: result.rc != 0 and 'not found' not in result.stderr</code> — custom fail condition. <code>changed_when: false</code> — nie raportuj jako changed. <code>block/rescue/always</code> — try/catch/finally. <code>any_errors_fatal: true</code> — zatrzymaj wszystkie hosty gdy jeden fail." },
    { q: "Co to Terraform workspace vs multiple state files?", a: "Workspace: ten sam kod, osobny state per workspace (dev/staging/prod). Prosto ale zmienna <code>terraform.workspace</code> w kodzie = coupling. Lepsze podejście dla dużych proj: osobne katalogi per środowisko (DRY przez Terragrunt) lub osobne repozytoria. Workspace dobry dla krótkotrwałych środowisk (feature branches)." },
    { q: "Jak debugować Terraform — co gdy plan nie zgadza się z rzeczywistością?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Drift: <code>terraform plan</code> pokazuje różnicę między state a rzeczywistością. Import istniejących zasobów: <code>terraform import aws_instance.web i-1234567890</code>. Refresh: <code>terraform apply -refresh-only</code>. Debug: <code>TF_LOG=DEBUG terraform plan</code>. State show: <code>terraform state show aws_instance.web</code>." },
    { q: "Co to Terraform testing — terratest, check blocks?", a: "Terratest (Go): deploy infrastruktury w testowym środowisku, weryfikuj przez API/SSH, destroy. <code>check</code> blocks (Terraform 1.5+): stałe asercje w konfiguracji (np. sprawdź czy cert nie wygasa). <code>precondition/postcondition</code>: walidacja input/output. <code>terraform validate</code> + <code>tflint</code> dla statycznej analizy." },
    { q: "Jak zarządzać sekretami w Terraform?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Nigdy nie hardcode'uj sekretów w .tf plikach (trafiają do state i SCM). Podejścia: zmienne środowiskowe (<code>TF_VAR_db_password</code>), Vault provider (<code>data.vault_generic_secret</code>), AWS Secrets Manager data source, SOPS + terraform-sops. State zawiera wrażliwe dane — szyfruj backend (S3+KMS). <code>sensitive = true</code> dla outputs." },
    { q: "Co to Terragrunt i kiedy warto użyć?", a: "Wrapper nad Terraform rozwiązujący DRY problem. <code>find_in_parent_folders()</code> — dziedzicz konfigurację backendu. <code>dependency</code> blocks — zależności między modułami. <code>terragrunt run-all plan</code> — uruchom cały stack. Warto gdy: wiele środowisk, wiele modułów, duplikacja backend config. Alternatywa: Terraform Stacks (nowy feature)." },
    { q: "Jak Ansible obsługuje idempotentność przy złożonych zadaniach?", a: "<code>command/shell</code> NIE są idempotentne — zawsze uruchamiają. Rozwiązanie: <code>creates=/path/to/file</code> (skip jeśli plik istnieje), <code>when: not stat_result.stat.exists</code>, <code>changed_when: false</code>. Preferuj dedykowane moduły (<code>file, copy, template, user, service</code>) — mają wbudowaną idempotentność. Custom moduły: sprawdzaj stan przed zmianą." }
  ]},

  { title: "Ansible — Load Balancer & Wdrożenia", cat: "Infra/IaC", qa: [
    { q: "Jak skonfigurować nginx load balancer przez Ansible?", a: "<span class='tip-badge tip-cmd'>CMD</span> Moduł <code>ansible.builtin.template</code> do wdrożenia config nginx. Szablon j2: <code>upstream backend { {% for host in groups['webservers'] %}server {{ hostvars[host]['ansible_default_ipv4']['address'] }}:8080; {% endfor %} }\nserver { listen 80; location / { proxy_pass http://backend; } }</code>. Task: <code>template: src=nginx_lb.conf.j2 dest=/etc/nginx/conf.d/lb.conf</code> + <code>notify: reload nginx</code>." },
    { q: "Jak wdrożyć HAProxy z dynamicznymi backendami przez Ansible?", a: "Szablon j2 dla haproxy.cfg: <code>backend web_servers\n  balance roundrobin\n  {% for h in groups['web'] %}\n  server {{ h }} {{ hostvars[h]['ansible_default_ipv4']['address'] }}:80 check\n  {% endfor %}</code>. Moduł <code>community.general.haproxy</code>: zarządzanie stanem serwerów w działającym HAProxy: <code>community.general.haproxy: state=disabled host={{ item }} socket=/var/run/haproxy.sock</code>. Używaj podczas rolling deploy." },
    { q: "Jak zrobić rolling deploy z wyłączaniem z load balancera?", a: "<code>serial: 1</code> lub <code>serial: '25%'</code> — przetwarza po jednym hoście. Flow: 1) <code>community.general.haproxy: state=disabled host={{ inventory_hostname }}</code>, 2) wdróż aplikację, 3) <code>uri: url=http://{{ inventory_hostname }}/health</code> z <code>until/retries</code>, 4) <code>haproxy: state=enabled</code>. <code>any_errors_fatal: true</code> + <code>max_fail_percentage: 0</code> dla bezpieczeństwa." },
    { q: "Jak używać modułu ansible.builtin.uri do healthchecków i API?", a: "<code>- name: wait for app\n  ansible.builtin.uri:\n    url: http://{{ inventory_hostname }}:8080/health\n    status_code: 200\n  register: result\n  until: result.status == 200\n  retries: 15\n  delay: 10</code>. POST z JSON: <code>method: POST, body_format: json, body: {key: value}</code>. Auth: <code>url_username/url_password</code> lub <code>headers: {Authorization: 'Bearer {{ token }}'}</code>. <code>validate_certs: no</code> dla self-signed (dev only)." },
    { q: "Jak zarządzać certyfikatami SSL przez Ansible (community.crypto)?", a: "<code>community.crypto.openssl_privatekey: path=/etc/ssl/private/app.key size=4096</code>. CSR: <code>community.crypto.openssl_csr: path=app.csr privatekey_path=app.key common_name=app.firma.pl</code>. Self-signed: <code>community.crypto.x509_certificate: provider=selfsigned</code>. Let's Encrypt: <code>community.crypto.acme_certificate: account_key_src=... csr=... dest=cert.pem acme_directory=https://acme-v02.api.letsencrypt.org/directory</code>." }
  ]},

  { title: "Terraform / IaC", cat: "Infra/IaC", qa: [
    { q: "Terraform workflow?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>init</code> (pobiera providerów, inicjalizuje backend) → <code>validate</code> → <code>plan</code> (diff) → <code>apply</code> → <code>destroy</code>. State: local (dev) lub remote backend (S3+DynamoDB locking). Workspace: <code>terraform workspace new prod</code>." },
    { q: "Co to Terraform modules?", a: "Reużywalne bloki infrastruktury. Source: <code>./modules/vpc</code>, Git URL, lub registry.terraform.io. Wersjonowanie przez <code>version = '~> 2.0'</code>. Przeazaj zmienne przez <code>variable</code>/<code>output</code>. Moduły oficjalne: <code>terraform-aws-modules</code>." },
    { q: "Jak zarządzać state?", a: "Remote backend: S3 (AWS) + DynamoDB (locking). <code>terraform state list/show/mv/rm/import</code>. State zawiera wrażliwe dane — szyfruj w S3 + KMS. <code>terraform state pull > backup.tfstate</code>. Nigdy nie edytuj ręcznie. Terraform Cloud ma state management wbudowany." },
    { q: "Różnica resource vs data source?", a: "<code>resource</code>: tworzy/zarządza/niszczy infrastrukturę. <code>data</code>: odczytuje istniejące zasoby (tylko lookup, brak modyfikacji). Przykład: <code>data \"aws_ami\" \"ubuntu\" { most_recent = true ... }</code> zwraca ID aktualnego AMI." },
    { q: "Co to locals, variables, outputs?", a: "<code>variable</code>: wejście od użytkownika lub CI/CD. <code>locals</code>: obliczone wartości wewnętrzne (DRY). <code>output</code>: eksportuje wartości po apply (np. IP instancji). Precedencja zmiennych: tfvars < env (TF_VAR_) < -var flag < default." },
    { q: "Co to Terraform lifecycle i meta-arguments?", a: "<code>count</code> i <code>for_each</code>: tworzenie wielu zasobów. <code>depends_on</code>: jawna zależność. <code>lifecycle { create_before_destroy = true }</code>. <code>prevent_destroy = true</code> zabezpiecza przed <code>terraform destroy</code>. <code>ignore_changes</code> ignoruje drift." },
    { q: "Jak działają provisioners i kiedy ich unikać?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> <code>local-exec</code>, <code>remote-exec</code>, <code>file</code>. Terraform traktuje je jako ostateczność — łamią idempotentność. Lepsze alternatywy: user_data (cloud-init), Ansible po provisioning, packer dla AMI. Provisioners = code smell." },
    { q: "Co to Terragrunt?", a: "Wrapper nad Terraform — DRY konfiguracja, remote state automatycznie, środowiska (dev/staging/prod) jako foldery z minimalną konfiguracją. <code>include 'root' { path = find_in_parent_folders() }</code>. Run-all dla dependencji między modułami." },
    { q: "Jak testować infrastrukturę Terraform?", a: "<span class='tip-badge tip-info'>INFO</span> Terratest (Go): deploy w test environment, assert przez API, destroy. <code>terraform test</code> (built-in od TF 1.6): pliki <code>.tftest.hcl</code>. Statyczna analiza: <code>tflint</code>, <code>trivy</code> (bezpieczeństwo), <code>checkov</code>. Pre-commit hook: <code>terraform fmt --check && terraform validate</code>. Policy as code: Sentinel (Terraform Cloud) lub OPA." },
    { q: "Jak zarządzać wieloma środowiskami w Terraform bez duplikacji?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Podejście 1: Terragrunt z <code>inputs = merge(local.common, local.env_specific)</code>. Podejście 2: moduły + osobne <code>envs/dev/main.tf</code>. Podejście 3: Terraform Workspaces (proste, ale coupling). Zmienna środowiskowa: <code>TF_VAR_env=prod terraform apply</code>. Najlepsza praktyka: moduły + env-specific tfvars files." },
    { q: "Co to Pulumi i czym różni się od Terraform?", a: "Pulumi: IaC w prawdziwych językach programowania (TypeScript, Python, Go, C#). Warunki, pętle, klasy bez HCL limitations. State: Pulumi Cloud lub self-hosted. Import z Terraform: <code>pulumi convert --from terraform</code>. Wadą: mniejszy ekosystem, trudniejszy debugging. Terraform: declarative HCL, większa społeczność, więcej providerów." }
  ]},

  { title: "Terraform — Zaawansowane", cat: "Infra/IaC", qa: [
    { q: "Co to Terraform provider development?", a: "<span class='tip-badge tip-info'>INFO</span> Provider Plugin SDK v2 (starszy) lub Terraform Plugin Framework (nowszy, Go). Struktura: <code>resource_server.go</code> z CRUD functions, <code>provider.go</code> z konfiguracją. Schema: <code>schema.Schema{Type: schema.TypeString, Required: true}</code>. Test: Terraform acceptance tests z prawdziwymi zasobami. Publikacja: Terraform Registry + GitHub Actions. Używaj gdy brak istniejącego providera." },
    { q: "Jak używać Terraform z wieloma cloudami (multi-cloud)?", a: "Osobne provider bloki: <code>provider \"aws\" { region = \"eu-west-1\" alias = \"eu\" }</code>. Użycie: <code>resource \"aws_instance\" \"x\" { provider = aws.eu ... }</code>. Cross-cloud: dane z jednego clouda w drugim przez <code>data</code> sources. Moduły z <code>providers</code> argument dla przekazania. State per cloud w osobnych workspace/katalogach. Terragrunt dependency blocks dla cross-module outputs." },
    { q: "Co to Terraform Sentinel i policy as code?", a: "Sentinel: policy engine Terraform Cloud/Enterprise. Polityki sprawdzają plany przed apply. Przykład: <code>import \"tfplan/v2\" as tfplan\nall_instances_use_approved_ami = rule { all tfplan.resource_changes[\"aws_instance\"] as _, rc { rc.change.after.ami == \"ami-approved\" } }</code>. Poziomy: advisory (warn), soft-mandatory (override możliwy), hard-mandatory (blokuje). Open-source alternatywa: OPA + conftest." },
    { q: "Jak zarządzać Terraform state w dużych organizacjach?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Podział state: per-środowisko, per-komponent (sieć osobno, aplikacja osobno). Remote backend S3+DynamoDB: <code>backend \"s3\" { bucket=\"tf-state\" key=\"prod/network/terraform.tfstate\" dynamodb_table=\"tf-locks\" encrypt=true }</code>. Cross-state refs: <code>data \"terraform_remote_state\"</code>. State locking przy concurrent apply. Terraform Cloud: collaboration features, run history, policy enforcement." },
    { q: "Jak testować moduły Terraform (terratest)?", a: "Terratest (Go): deploy real infra → verify → destroy. <code>defer terraform.Destroy(t, opts)</code>. <code>terraform.InitAndApply(t, opts)</code>. <code>http_helper.HttpGetWithRetry</code>. Szybsze testy: <code>terraform validate</code> + <code>tflint</code> + <code>checkov</code> dla statycznej analizy. <code>terraform plan -out=tfplan && conftest test tfplan.json</code> dla OPA policies. Unit tests: mockery + mocking providers (eksperymentalne)." }
  ]},

  { title: "Git — Kontrola wersji", cat: "Infra/IaC", qa: [
    { q: "Git flow vs trunk-based development?", a: "Git flow: długo żyjące branche (main, develop, feature/*, release/*, hotfix/*). Dobre dla release cycles z wersjonowaniem. Trunk-based: wszystko do main, krótkie branche (< 2 dni), feature flags, CI/CD friendly — standard w DevOps." },
    { q: "Co to rebase vs merge?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> merge: zachowuje historię, merge commit. rebase: przepisuje historię, liniowy log. <code>git rebase -i HEAD~3</code>: interactive squash/edit/drop. Złota zasada: nigdy nie rebase'uj publicznych/shared branchy. Fast-forward merge: <code>--ff-only</code>." },
    { q: "Jak cofnąć zmiany?", a: "<code>git revert HEAD</code>: nowy commit cofający (bezpieczny, nie zmienia historii). <code>git reset --soft HEAD~1</code>: cofnij commit, zachowaj staged. <code>--mixed</code>: unstaged. <code>--hard</code>: usuń zmiany (niebezpieczny). <code>git restore plik</code>: odrzuć working tree. <code>git reflog</code> = twój ratunek." },
    { q: "Co to git hooks?", a: "Skrypty w <code>.git/hooks/</code> wykonywane przed/po operacjach. pre-commit: lint/format. commit-msg: walidacja formatu (Conventional Commits). pre-push: testy. post-receive: deployment (bare repo). Narzędzia: <code>pre-commit</code> framework, <code>husky</code> (Node)." },
    { q: "Co to Conventional Commits?", a: "Standard formatowania commit messages: <code>type(scope): description</code>. Typy: feat, fix, docs, style, refactor, test, chore. Triggery: feat → minor version bump, fix → patch, BREAKING CHANGE → major. Automatyczna generacja CHANGELOG. <code>semantic-release</code>." },
    { q: "Jak działa git cherry-pick i kiedy używać?", a: "<code>git cherry-pick abc123</code> — aplikuje konkretny commit na aktualny branch. Użycie: backport bugfixa do starszej release branch. <code>cherry-pick A..B</code> zakres. Unikaj regularnego cherry-pick — sygnał złej struktury branchy. <code>--no-commit</code> dla podglądu." },
    { q: "Jak działa git bisect?", a: "<span class='tip-badge tip-cmd'>CMD</span> Binarne wyszukiwanie regresjii. <code>git bisect start</code>. <code>git bisect bad HEAD</code> (aktualny = zły). <code>git bisect good v1.0</code> (ostatni dobry). Git checkoutuje środkowy commit — testuj, oznacz <code>good/bad</code>. Po znalezieniu: <code>git bisect reset</code>. Automatyzacja: <code>git bisect run ./test.sh</code> — skrypt exit 0 = good, exit 1 = bad." },
    { q: "Co to git submodules i git subtree?", a: "Submodule: repozytorium wewnątrz repozytorium (wskaźnik na konkretny commit). <code>git submodule add URL path</code>. Clone z submodułami: <code>git clone --recurse-submodules</code>. Update: <code>git submodule update --init --remote</code>. Subtree: wbudowuje całą historię drugiego repo. Prostszy dla użytkowników (brak dodatkowych komend), trudniejszy w zarządzaniu. Użyj subtree gdy chcesz kontrybuować z powrotem do projektu." },
    { q: "Jak skonfigurować GitLab CI/CD pipeline?", a: "<code>.gitlab-ci.yml</code>: <code>stages: [build, test, deploy]\nbuild:\n  stage: build\n  image: maven:3.8\n  script: mvn package\n  artifacts:\n    paths: [target/*.jar]\ndeploy-prod:\n  stage: deploy\n  environment: production\n  when: manual\n  script: ./deploy.sh</code>. Runners: shared (GitLab.com), specific (własny), Docker executor. Variables: Settings → CI/CD → Variables (masked/protected)." }
  ]},

  { title: "AWS — Amazon Web Services", cat: "Cloud", qa: [
    { q: "Kluczowe usługi AWS dla Linux admina?", a: "EC2 (VM), S3 (object storage), VPC (sieć), IAM (auth/authz), CloudWatch (monitoring/logi), Systems Manager (patch, session bez SSH), ECS/EKS (kontenery), Route53 (DNS), RDS (managed DB), CloudTrail (audit), KMS (szyfrowanie)." },
    { q: "Co to AWS IAM i best practices?", a: "Users, Groups, Roles, Policies (JSON). <span class='tip-badge tip-warn'>WAŻNE</span> Nie używaj root account na co dzień. MFA wszędzie. Roles dla EC2/Lambda (nie access keys). Zasada least privilege. IAM Access Analyzer. Rotuj access keys. <code>aws sts get-caller-identity</code> — sprawdź kto jesteś." },
    { q: "Co to VPC i kluczowe komponenty?", a: "Virtual Private Cloud. Subnety public/private, Internet Gateway, NAT Gateway (private → internet), Route Tables, Security Groups (stateful), NACLs (stateless). VPC Peering, Transit Gateway (hub-and-spoke). PrivateLink dla usług AWS bez internetu." },
    { q: "Security Groups vs NACLs?", a: "SG: stateful (reply automatyczny), per-instancja, allow rules only. NACL: stateless (osobne reguły dla ruchu powrotnego), per-subnet, allow i deny rules, numerowane. SG: pierwsza linia obrony. NACL: dodatkowa warstwa per subnet." },
    { q: "Co to AWS Systems Manager (SSM)?", a: "<span class='tip-badge tip-info'>INFO</span> Session Manager: dostęp do EC2 bez SSH/bastion (przez agent). Patch Manager: automatyczne patche. Parameter Store: sekrety/config (bezpłatny). Secrets Manager (płatny, rotacja). Run Command: zdalne komendy na flotcie. Inventory: skaner zainstalowanego oprogramowania." },
    { q: "Jak działa Auto Scaling?", a: "ASG (Auto Scaling Group) skaluje EC2 na podstawie polityk: Target Tracking (np. CPU 70%), Step Scaling (reaguje na alarmy), Scheduled. Launch Template definiuje konfigurację instancji. Łączy się z ALB dla health checks i traffic distribution." },
    { q: "Co to CloudWatch i jak monitorować?", a: "<span class='tip-badge tip-cmd'>CMD</span> Metryki (built-in + custom), Logi (Log Groups/Streams), Alarms (SNS/Auto Scaling). Agent (<code>amazon-cloudwatch-agent</code>) dla logów i metryk OS-level. Insights do analityki logów (SQL-like). Dashboards. Contributor Insights dla wzorców." },
    { q: "Co to S3 i storage classes?", a: "Object storage. Storage classes: Standard, Intelligent-Tiering, Standard-IA, One Zone-IA, Glacier Instant/Flexible/Deep Archive. Lifecycle policies dla automatycznego tiering. Wersjonowanie, bucket policies, presigned URLs. S3 Transfer Acceleration przez CloudFront." },
    { q: "Co to ECS vs EKS?", a: "ECS: managed container orchestration (native AWS, simpler). Fargate: serverless containers (bez zarządzania EC2). EKS: managed Kubernetes — większy ecosystem, multi-cloud portability, bardziej złożony. ECS tańszy i prostszy dla małych zespołów." },
    { q: "Co to AWS Lambda i kiedy używać?", a: "<span class='tip-badge tip-info'>INFO</span> Serverless — kod wykonywany na zdarzenie (S3 event, API GW, SQS, CloudWatch Events). Limit: 15 min timeout, 10GB RAM. Cena: per invocation + duration. Użyj gdy: ETL, webhooks, scheduled tasks, event processing. Problemy: cold start, vendor lock-in, trudny debugging. Lokalnie: SAM CLI lub LocalStack." },
    { q: "Jak zarządzać kosztami AWS?", a: "<span class='tip-badge tip-cmd'>CMD</span> Cost Explorer: analiza per service/tag. Budgets: alert przy przekroczeniu. Savings Plans / Reserved Instances: -40-72% vs On-Demand. Spot Instances: -90% dla fault-tolerant workloads (K8s, Batch). Rightsizing: <code>AWS Compute Optimizer</code>. Tagi: <code>Project, Environment, Owner</code> dla alokacji kosztów. S3 Intelligent-Tiering." },
    { q: "Co to AWS CDK i kiedy używać zamiast Terraform?", a: "CDK: IaC w TypeScript/Python/Java/C# — generuje CloudFormation. Lepszy dla: zespołów z silną preferencją do jednego języka, złożonej logiki, tight AWS integration. Terraform: multi-cloud, lepszy ekosystem, HCL czytelny dla ops. CDK Terraform (cdktf): CDK + Terraform providers. Oba mają konstrukty/moduły jako bloki budowania." }
  ]},

  { title: "AWS — Zaawansowane", cat: "Cloud", qa: [
    { q: "Co to AWS EKS i jak zarządzać?", a: "<span class='tip-badge tip-cmd'>CMD</span> EKS: managed Kubernetes control plane. <code>eksctl create cluster --name prod --region eu-west-1 --nodegroup-name workers --node-type t3.medium</code>. Kubeconfig: <code>aws eks update-kubeconfig --name prod</code>. Managed node groups: automatyczne AMI updates, drain przed terminacją. Fargate profiles: serverless pody. IAM roles for service accounts (IRSA): <code>eksctl create iamserviceaccount ...</code>." },
    { q: "Jak skonfigurować AWS VPC z best practices?", a: "Multi-AZ: subnety public/private per AZ. Private subnety: aplikacje i DB. Public: load balancery i NAT GW. Routing: private subnet → NAT GW → IGW. VPC Flow Logs: <code>aws ec2 create-flow-logs --resource-ids vpc-xxx --traffic-type ALL --log-destination-type s3</code>. Security: NACLs jako backup dla SG. Private Link dla usług AWS. VPC endpoints (Gateway dla S3/DynamoDB, Interface dla pozostałych)." },
    { q: "Co to AWS IAM Roles Anywhere i federation?", a: "Roles Anywhere: certyfikaty PKI jako credentials dla on-premise serwerów (nie potrzeba access keys). OIDC Federation: GitHub Actions OIDC → AWS role bez long-lived credentials. <code>assume-role-with-web-identity</code>. IAM Identity Center (SSO): centralny access management dla multi-account. Permission Sets: pre-defined role sets per account. SCP (Service Control Policies) na poziomie OU." },
    { q: "Jak monitorować AWS koszty?", a: "Cost Explorer: analiza per service/account/tag. Budgets: alerty przy przekroczeniu. Cost Anomaly Detection: ML-based alerts. Trusted Advisor: optymalizacja. Tagi: <code>Cost Center, Environment, Team</code> — wymagaj przez SCP. Spot Instances: do 90% taniej dla tolerant workloads. Reserved Instances / Savings Plans: do 72% dla predictable workloads. <code>aws ce get-cost-and-usage --granularity MONTHLY</code>." },
    { q: "Co to AWS Landing Zone i Control Tower?", a: "Landing Zone: wielokontowe środowisko AWS z security baseline (audit account, log archive account, SCPs, guardrails). Control Tower: managed service do konfiguracji Landing Zone. Account Vending Machine: automatyczne tworzenie nowych kont. Guardrails: preventive (SCP) + detective (Config rules). Customizations for Control Tower (CfCT): IaC dla customizacji. Alternatywa: własna implementacja przez Terraform + Organizations." }
  ]},

  { title: "Azure / GCP — Chmury", cat: "Cloud", qa: [
    { q: "Azure AD vs AWS IAM — kluczowe różnice?", a: "Azure AD: pełnoprawny IdP (OAuth2, OIDC, SAML), synchronizacja z on-premise AD (AD Connect), Conditional Access, MFA. AWS IAM: per-account, brak federacji by default. IAM Identity Center (SSO) integruje zewnętrzne IdP. Azure AD bardziej rozbudowany enterprise." },
    { q: "Co to Azure Resource Manager (ARM)?", a: "Warstwa zarządzania dla wszystkich zasobów Azure. Deployment przez ARM templates (JSON) lub Bicep (DSL). Resource Groups jako unit zarządzania. RBAC (Role-Based Access Control) na poziomie subscription/resource group/resource. Tags dla organizacji i kosztów." },
    { q: "Azure networking — kluczowe koncepty?", a: "VNet (jak AWS VPC), Subnety, NSG (Network Security Groups — jak Security Groups), Azure Firewall, Application Gateway (L7 LB), Azure Load Balancer (L4), VPN Gateway, ExpressRoute (direct connect), Virtual WAN." },
    { q: "Co to GCP i kluczowe usługi?", a: "GCE (VM), GCS (storage), GKE (managed K8s — najlepszy managed K8s), BigQuery (data warehouse), Cloud Run (serverless containers), Cloud SQL, Anthos (hybrid multi-cloud), IAM, Cloud Armor (WAF/DDoS). GKE Autopilot = serverless K8s." },
    { q: "Co to Azure DevOps?", a: "Platforma CI/CD: Boards (Jira-like), Repos (Git), Pipelines (CI/CD YAML), Artifacts (package registry), Test Plans. Integracja z GitHub. Alternatywa do GitLab/Jenkins w ekosystemie Microsoft. Pipelines jako kod (azure-pipelines.yml)." },
    { q: "Co to Azure Managed Identity i kiedy używać?", a: "<span class='tip-badge tip-info'>INFO</span> Eliminuje potrzebę przechowywania credentials w aplikacji. System-assigned: powiązana z konkretnym zasobem (VM, App Service), usuwana z zasobem. User-assigned: niezależna, przypisywalna do wielu zasobów. Użycie: VM odczytuje Key Vault przez MSI bez passwords. <code>az login --identity</code> w skrypcie. Najlepsza praktyka dla aplikacji w Azure." },
    { q: "Co to GKE Autopilot vs Standard?", a: "Autopilot: Google zarządza całym klastrem (nodes, nodepool scaling, security). Pay per Pod resources. Brak dostępu do node. Ograniczenia: niektóre DaemonSety, privileged containers. Standard: pełna kontrola nad node pools, dowolna konfiguracja. Autopilot zalecany dla nowych projektów — prostszy, tańszy przy rzadkim użyciu." }
  ]},

  { title: "Jenkins — CI/CD", cat: "CI/CD", qa: [
    { q: "Co to Jenkins i jak działa?", a: "<span class='tip-badge tip-info'>INFO</span> Open-source serwer CI/CD. Master (controller) rozdziela zadania na agentów (nodes). Joby: Freestyle (klikanie), Pipeline (kod). Wyzwalacze: SCM polling, webhook (GitHub/GitLab), cron, upstream job. Przechowuje artefakty i historię buildów." },
    { q: "Czym różni się Declarative od Scripted Pipeline?", a: "Declarative: nowszy, ścisła składnia (<code>pipeline { agent any; stages { stage('Build') { steps { ... } } } }</code>), łatwiejszy do czytania, ograniczone możliwości. Scripted: Groovy DSL (<code>node { stage('Build') { ... } }</code>), pełna elastyczność, trudniejszy. Declarative = standard." },
    { q: "Jak wygląda typowy Jenkinsfile?", a: "<code>pipeline { agent any\nstages {\n  stage('Checkout') { steps { checkout scm } }\n  stage('Build') { steps { sh 'mvn package' } }\n  stage('Test') { steps { sh 'mvn test' } }\n  stage('Deploy') { steps { sh './deploy.sh' } }\n}\npost { always { junit 'target/surefire-reports/*.xml' } } }</code>" },
    { q: "Co to Jenkins Agent / Node?", a: "Agent wykonuje zadania zlecone przez controller. Typy: permanent node (SSH, JNLP), dynamic (Docker, Kubernetes — tworzone na żądanie, niszczone po buildzie). <code>agent { docker 'maven:3.8' }</code> uruchamia build w kontenerze Docker. <code>agent { label 'linux' }</code> dla konkretnego node." },
    { q: "Jak zarządzać sekretami w Jenkins?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Credentials Store (Manage Jenkins → Credentials). Typy: Username/Password, SSH Key, Secret Text, Certificate. W Pipeline: <code>withCredentials([usernamePassword(credentialsId: 'my-creds', usernameVariable: 'USER', passwordVariable: 'PASS')]) { sh 'docker login -u $USER -p $PASS' }</code>." },
    { q: "Co to shared library w Jenkins?", a: "Reużywalny kod Groovy dostępny we wszystkich pipeline'ach organizacji. Struktura: <code>vars/myStep.groovy</code> (globalne funkcje), <code>src/org/myorg/Helper.groovy</code> (klasy). Import: <code>@Library('my-shared-lib') _</code>. Konfiguracja w Manage Jenkins → System → Global Pipeline Libraries." },
    { q: "Jak działają triggery i webhooks w Jenkins?", a: "<span class='tip-badge tip-cmd'>CMD</span> Declarative: <code>triggers { pollSCM('H/5 * * * *') }</code> lub <code>triggers { githubPush() }</code>. Webhook: GitHub → Settings → Webhooks → <code>https://jenkins/github-webhook/</code>. Multibranch Pipeline automatycznie wykrywa nowe branche i PR." },
    { q: "Co to Blue Ocean i Jenkins X?", a: "Blue Ocean: nowoczesny UI dla Jenkins Pipeline (wizualizacja, PR support). Jenkins X: CI/CD na Kubernetes — automatyczne pipeline'y, GitOps, Preview Environments. Alternatywy do Jenkins w K8s: Tekton (cloud-native), ArgoCD Workflows, GitHub Actions." },
    { q: "Jak skalować Jenkins?", a: "Horizontal scaling: więcej agentów (stałych lub dynamicznych przez Kubernetes plugin). Master HA: nie ma natywnej HA — użyj backup + szybki restore, lub Jenkins Operator na K8s. Artifact storage: Nexus/Artifactory zamiast lokalnego. Folder/View organizacja jobów." },
    { q: "Jak zabezpieczyć Jenkins?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Matrix-based security lub Role Strategy plugin. CSRF protection włączone. Agents przez JNLP (nie SSH gdy możliwe). Skrypt Security Manager: Script Approval dla Groovy. Regularne aktualizacje pluginów. Reverse proxy (Nginx) przed Jenkins. LDAP/SAML auth." },
    { q: "Jak debugować failed pipeline?", a: "<code>Replay</code>: uruchom pipeline ponownie z edycją (bez commitu). Console Output: pełne logi. <code>sh 'set -x; ./script.sh'</code> dla verbose shell. <code>echo env</code> lub <code>printenv</code>. <code>input</code> step: zatrzymaj pipeline do ręcznej inspekcji. Blue Ocean timeline dla wizualizacji." },
    { q: "Co to Multibranch Pipeline?", a: "Automatycznie tworzy pipeline dla każdego brancha/PR w repo. Wykrywa Jenkinsfile w każdym branchu. PR preview environments. Branch indexing: co ile sprawdzać nowe branche. Orphaned branch strategy: usuń stare joby. Integracja z GitHub/GitLab/Bitbucket." }
  ]},

  { title: "Jenkins — Mid Level", cat: "CI/CD", qa: [
    { q: "Jak zaimplementować parallel stages w Jenkinsfile?", a: "<code>stage('Tests') { parallel { stage('Unit') { steps { sh 'mvn test' } } stage('Integration') { steps { sh 'mvn verify' } } stage('Lint') { steps { sh 'npm run lint' } } } }</code>. <code>failFast: true</code> — przerwij wszystkie gdy jeden fail. Parallel stages znacząco skracają czas buildu." },
    { q: "Jak zarządzać zależnościami między jobami?", a: "<span class='tip-badge tip-info'>INFO</span> Upstream/downstream triggers: <code>triggers { upstream(upstreamProjects: 'build-job', threshold: hudson.model.Result.SUCCESS) }</code>. <code>build job: 'deploy', parameters: [string(name: 'VERSION', value: env.BUILD_NUMBER)]</code>. Odczekaj: <code>waitForBuildReady</code>. Pipeline as a service: orchestracja przez główny pipeline." },
    { q: "Co to stash/unstash i kiedy używać?", a: "<code>stash name: 'artifacts', includes: 'target/*.jar'</code> — zapisuje pliki między stage'ami na różnych agentach. <code>unstash 'artifacts'</code> — przywraca. Używaj gdy parallel stages na różnych nodeach potrzebują tych samych plików. Alternatywa: artefakty w Nexus/Artifactory dla trwałego przechowywania." },
    { q: "Jak obsłużyć failed build — retry, post, timeout?", a: "<code>retry(3) { sh './flaky-test.sh' }</code>. Timeout: <code>timeout(time: 10, unit: 'MINUTES') { ... }</code>. Post: <code>post { failure { mail to: 'team@x.com', subject: 'FAILED' } always { junit '**/*.xml' } success { archiveArtifacts 'dist/**' } }</code>. <code>catchError(buildResult: 'UNSTABLE') { ... }</code>." },
    { q: "Jak używać Groovy w Jenkinsfile bezpiecznie?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Scripted Pipeline: pełne Groovy ale wymaga Script Approval lub @NonCPS dla metod niedozwolonych w sandboxie. <code>@NonCPS</code> dla metod serializacji. Unikaj dużej logiki w Jenkinsfile — przenieś do shared library. Groovy w Declarative: <code>script { ... }</code> blok. Nigdy nie drukuj sekretów przez <code>echo</code>." },
    { q: "Co to Docker Pipeline plugin i jak budować obrazy?", a: "<code>pipeline { agent { docker { image 'maven:3.8' args '-v /root/.m2:/root/.m2' } } ... }</code>. Build image: <code>def img = docker.build('myapp:${env.BUILD_NUMBER}')</code>. Push: <code>docker.withRegistry('https://registry', 'creds-id') { img.push() img.push('latest') }</code>. Multi-stage: <code>docker.build('myapp', '--target production .')</code>." },
    { q: "Jak integrować Jenkins z Kubernetes (agents)?", a: "Kubernetes plugin: dynamiczne pody jako agenci. <code>podTemplate(containers: [containerTemplate(name: 'maven', image: 'maven:3.8')]) { node(POD_LABEL) { container('maven') { sh 'mvn package' } } }</code>. Declarative: <code>agent { kubernetes { yaml '''spec: containers: ...''' } }</code>. Pod niszczony po buildzie — czyste środowisko za każdym razem." },
    { q: "Jak testować Jenkinsfile lokalnie?", a: "<span class='tip-badge tip-cmd'>CMD</span> Jenkins CLI: <code>java -jar jenkins-cli.jar -s http://jenkins declarative-linter < Jenkinsfile</code>. Replay w UI — edytuj i uruchom bez commitu. act (GitHub Actions lokalnie) nie działa dla Jenkins. Najlepiej: dedykowany Jenkins dev + Multibranch dla feature branchy. Unit test shared library: JenkinsPipelineUnit framework." },
    { q: "Jak zaimplementować deployment pipeline z approvalem?", a: "<code>stage('Deploy Prod') { input { message 'Deploy to production?' id 'proceed' ok 'Deploy' submitter 'devops-team' submitterParameter 'APPROVER' } steps { echo \"Approved by ${APPROVER}\" sh './deploy-prod.sh' } }</code>. Timeout na input: <code>timeout(time: 1, unit: 'HOURS') { input ... }</code>. Po przekroczeniu: abort lub auto-deploy." },
    { q: "Co to Jenkins Configuration as Code (JCasC)?", a: "Plugin pozwalający definiować całą konfigurację Jenkins jako YAML (<code>jenkins.yaml</code>). Credentials, security, nodes, plugins, tools — wszystko jako kod. GitOps dla Jenkins. <code>CASC_JENKINS_CONFIG=/path/to/jenkins.yaml</code>. Razem z Job DSL plugin = pełna powtarzalna instalacja. Niezbędne przy Jenkins na K8s (Operator)." },
    { q: "Jak zintegrować Jenkins z SonarQube?", a: "<span class='tip-badge tip-cmd'>CMD</span> Plugin: SonarQube Scanner. Konfiguracja: Manage Jenkins → SonarQube servers. Pipeline: <code>withSonarQubeEnv('MySonar') { sh 'mvn sonar:sonar' }</code>. Quality Gate: <code>waitForQualityGate abortPipeline: true</code>. SonarQube webhook → Jenkins callback. Metryki: coverage, duplications, bugs, code smells, security hotspots." },
    { q: "Jak działa Jenkins distributed builds architektura?", a: "Controller (master): orchestracja, UI, scheduling — nie wykonuje build tasks. Agents (nodes): faktyczna praca. Połączenie: SSH (controller → agent), JNLP/WebSocket (agent → controller). Kubernetes plugin: agenci jako ephemeral pods. Etykiety (labels): <code>agent { label 'linux && docker' }</code>. Controller bez agenta = nieproduktyjna architektura (controller nie powinien budować)." }
  ]},

  { title: "Prometheus / Grafana / Splunk", cat: "Monitoring", qa: [
    { q: "Jak działa Prometheus?", a: "Pull model — scrape endpointów <code>/metrics</code> co interval (default 15s). Dane w wbudowanej TSDB (2h local, długoterminowo: Thanos/Cortex/VictoriaMetrics). PromQL do zapytań. Alertmanager do powiadomień (email/PagerDuty/Slack). Service Discovery: K8s, Consul, EC2." },
    { q: "Kluczowe typy metryk Prometheus?", a: "<span class='tip-badge tip-info'>INFO</span> Counter: monotonicznie rosnący (żądania, błędy). Gauge: chwilowa wartość (pamięć, temperatura). Histogram: rozkład (latencja z buckets, <code>_bucket, _sum, _count</code>). Summary: percentyle po stronie klienta. <code>rate(counter[5m])</code> dla counter." },
    { q: "Przykłady PromQL?", a: "<code>rate(http_requests_total[5m])</code> — RPS. <code>histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m]))</code> — p99 latency. <code>100 - (avg by (instance)(rate(node_cpu_seconds_total{mode='idle'}[5m])) * 100)</code> — CPU usage." },
    { q: "Grafana — jak skonfigurować?", a: "<span class='tip-badge tip-cmd'>CMD</span> Data sources: Prometheus, Loki, Elasticsearch, CloudWatch, InfluxDB. Panels: Time series, Stat, Gauge, Table, Heatmap. Variables: <code>$job, $instance</code>. Alerting: kontakty (Slack/PagerDuty) + routing policies. Provisioning przez YAML/JSON." },
    { q: "Co to Alertmanager i jak konfigurować routing?", a: "Odbiera alerty z Prometheus, deduplikuje, grupuje, routuje. <code>route → receiver</code>. Silencing: <code>amtool silence add alertname=DiskFull</code>. Inhibition: blokuj alerty gdy inny aktywny. Grupowanie: <code>group_by: [alertname, cluster]</code>." },
    { q: "Co to Loki i kiedy zamiast Elasticsearch?", a: "Loki: logi bez pełnego indeksowania (tylko labels jak Prometheus), tanie storage (S3/GCS), LogQL. Mały footprint, tanie. Elasticsearch: pełnotekstowe wyszukiwanie, bogatszy query language, lepszy dla SIEM/complex analytics. Loki + Prometheus + Grafana = PLG stack." },
    { q: "Co to Splunk i jak się różni od open-source?", a: "Komercyjny, własny format zoptymalizowany, SPL (Search Processing Language), świetny SIEM, ML toolkit, przemysłowe wsparcie. Drogi (per GB ingested). Open-source alternatywy: ELK/OpenSearch, Grafana+Loki. Splunk dominuje w dużych enterprise i security." },
    { q: "Co to node_exporter i jakie metryki zbiera?", a: "Eksporter metryk OS-level dla Prometheus. CPU, pamięć, dyski (IOPS, utilization), sieć (bytes, errors, drops), filesystem, load average, NTP offset, systemd unit state. Instalacja: <code>apt/dnf install prometheus-node-exporter</code>. Endpoint: <code>:9100/metrics</code>." },
    { q: "Co to OpenTelemetry?", a: "CNCF standard dla observability: traces, metrics, logs. Vendor-neutral SDK + collector. Zastępuje OpenTracing + OpenCensus. Eksportuj do Jaeger, Tempo (traces), Prometheus (metrics), Loki/ES (logs). Auto-instrumentation dla popularnych frameworków." },
    { q: "Co to SLI, SLO, SLA i jak je definiować?", a: "<span class='tip-badge tip-info'>INFO</span> SLI (Service Level Indicator): miara jakości — latencja p99, error rate, availability. SLO (Service Level Objective): target dla SLI — np. 99.9% availability, p99 < 200ms. SLA (Service Level Agreement): kontrakt z karami za niedotrzymanie SLO. Error budget = 1 - SLO. Gdy błąd budżet się kończy → stop feature releases, focus na reliability. PromQL dla SLO: <code>sum(rate(http_requests_total{code!~'5..'}[5m])) / sum(rate(http_requests_total[5m]))</code>." },
    { q: "Jak skonfigurować alerting w Prometheus?", a: "<span class='tip-badge tip-cmd'>CMD</span> Alert rules w <code>rules.yml</code>: <code>groups:\n- name: linux\n  rules:\n  - alert: DiskFull\n    expr: disk_free_percent < 10\n    for: 5m\n    labels:\n      severity: critical\n    annotations:\n      summary: 'Dysk {{ $labels.mountpoint }} prawie pełny'</code>. Alertmanager routing: severity → PagerDuty (critical), Slack (warning). Inhibit: jeśli node down, wycisz alerty jego serwisów." }
  ]},

  { title: "PostgreSQL — Administracja", cat: "Database", qa: [
    { q: "Jak połączyć się z PostgreSQL i podstawowe polecenia?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>psql -U postgres -h localhost -d mydb</code>. Meta-komendy: <code>\\l</code> (bazy), <code>\\c mydb</code> (połącz), <code>\\dt</code> (tabele), <code>\\d tabela</code> (struktura), <code>\\du</code> (użytkownicy), <code>\\timing</code> (czas zapytań), <code>\\e</code> (edytor), <code>\\q</code> (wyjście)." },
    { q: "Jak zarządzać użytkownikami i uprawnieniami?", a: "<code>CREATE USER jan WITH PASSWORD 'tajne';</code>. <code>CREATE ROLE devs;</code>. <code>GRANT SELECT, INSERT ON tabela TO jan;</code>. <code>GRANT devs TO jan;</code>. <code>GRANT CONNECT ON DATABASE mydb TO jan;</code>. <code>REVOKE ALL ON tabela FROM jan;</code>. <code>\\dp tabela</code> — sprawdź uprawnienia." },
    { q: "Co to pg_hba.conf i jak działa autentykacja?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Host-Based Authentication. Format: <code>TYPE DATABASE USER ADDRESS METHOD</code>. Metody: <code>trust</code> (bez hasła), <code>md5/scram-sha-256</code> (hasło), <code>peer</code> (OS user), <code>ldap</code>, <code>cert</code>. Kolejność wierszy ma znaczenie — pierwszy match wygrywa. Reload: <code>pg_ctlcluster reload</code>." },
    { q: "Jak wykonać backup i restore?", a: "<code>pg_dump -U postgres mydb > backup.sql</code>. Kompresja: <code>pg_dump -Fc mydb > backup.dump</code>. Restore: <code>psql mydb < backup.sql</code> lub <code>pg_restore -d mydb backup.dump</code>. Cały serwer: <code>pg_dumpall > all.sql</code>. PITR: WAL archiving + <code>pg_basebackup</code>." },
    { q: "Co to VACUUM i ANALYZE?", a: "<span class='tip-badge tip-info'>INFO</span> VACUUM: usuwa dead tuples (MVCC zostawia stare wersje wierszy). VACUUM FULL: przepisuje tabelę (blokuje). ANALYZE: aktualizuje statystyki planera. Autovacuum: daemon robi to automatycznie. <code>pg_stat_user_tables</code>: sprawdź n_dead_tup. Bloat monitoring: pgstattuple." },
    { q: "Co to WAL (Write-Ahead Logging)?", a: "Dziennik transakcji — zmiany trafiają najpierw do WAL (Write-Ahead Log), potem do heap. Zapewnia: durability (ACID), crash recovery, replikacja (streaming/logical), PITR. <code>wal_level</code>: minimal, replica, logical. <code>archive_mode</code> + <code>archive_command</code> dla backupu ciągłego." },
    { q: "Jak skonfigurować replikację streaming?", a: "Primary: <code>wal_level=replica</code>, <code>max_wal_senders=5</code>, utwórz replication user, wpis w pg_hba. Standby: <code>pg_basebackup -h primary -U replicator -D /data</code>, plik <code>standby.signal</code>, <code>primary_conninfo</code> w postgresql.conf. Monitor: <code>pg_stat_replication</code> na primary." },
    { q: "Co to connection pooling i kiedy używać?", a: "PostgreSQL tworzy nowy proces per połączenie — kosztowne przy setkach connections. Poolery: PgBouncer (transaction/session/statement pooling), Pgpool-II (też HA, load balance). PgBouncer transaction pooling: najlepsze dla OLTP. Sprawdź: <code>pg_stat_activity</code>." },
    { q: "Jak monitorować wydajność PostgreSQL?", a: "<span class='tip-badge tip-cmd'>CMD</span> <code>pg_stat_activity</code> (aktywne zapytania). <code>pg_stat_statements</code> (top N zapytań po czasie). <code>pg_locks</code> (blokady). <code>EXPLAIN (ANALYZE, BUFFERS) SELECT ...</code> (plan wykonania). Slow query log: <code>log_min_duration_statement = 1000</code>. Narzędzia: pgBadger, pgAnalyze." },
    { q: "Co to indeksy w PostgreSQL?", a: "Typy: B-tree (domyślny, =, <, >), Hash (=), GIN (tablice, JSONB, full-text), GiST (geometria, ranges), BRIN (duże tabele z korelacją). <code>CREATE INDEX CONCURRENTLY idx ON tabela(kolumna);</code> — nie blokuje. Partial index: <code>WHERE status='active'</code>. <code>\\d tabela</code> pokaże indeksy." },
    { q: "Jak działa EXPLAIN i jak czytać plan?", a: "<code>EXPLAIN (ANALYZE, BUFFERS, FORMAT TEXT) SELECT ...;</code>. Kluczowe: Seq Scan (brak indeksu), Index Scan, Index Only Scan (wydajny), Nested Loop/Hash Join/Merge Join. Koszt: <code>cost=startup..total</code>. Actual rows vs estimated — duża różnica = stare statystyki (ANALYZE)." },
    { q: "Co to MVCC w PostgreSQL?", a: "MVCC (Multi-Version Concurrency Control) — każda transakcja widzi snapshot danych — czytanie nie blokuje pisania i odwrotnie. Dead tuples: stare wersje wierszy po UPDATE/DELETE. VACUUM je usuwa. Transaction ID wraparound: niebezpieczny po ~2mld transakcji — autovacuum chroni. <code>age(relfrozenxid)</code>." },
    { q: "Jak zarządzać konfiguracją postgresql.conf?", a: "Kluczowe parametry: <code>shared_buffers</code> (25% RAM), <code>effective_cache_size</code> (50-75% RAM), <code>work_mem</code> (per sort/hash — ostrożnie), <code>maintenance_work_mem</code>, <code>max_connections</code>, <code>wal_buffers</code>, <code>checkpoint_completion_target=0.9</code>. Narzędzie: PGTune (pgtune.leopard.in.ua)." }
  ]},

  { title: "PostgreSQL — Mid Level", cat: "Database", qa: [
    { q: "Jak działa Query Planner i jak go oszukać gdy się myli?", a: "<span class='tip-badge tip-info'>INFO</span> Planer bazuje na statystykach (pg_statistic). Gdy szacunki złe: <code>ANALYZE tabela</code>, zwiększ <code>default_statistics_target</code> (domyślnie 100, max 10000) dla kolumn z nierównomiernym rozkładem: <code>ALTER TABLE t ALTER COLUMN c SET STATISTICS 500</code>. Plan hints: <code>enable_seqscan=off</code> (sesja). pg_hint_plan extension." },
    { q: "Co to bloat i jak go wykrywać/naprawiać?", a: "Table/index bloat: martwe krotki nie zebrane przez autovacuum. Sprawdź: <code>SELECT schemaname, tablename, n_dead_tup, n_live_tup FROM pg_stat_user_tables ORDER BY n_dead_tup DESC</code>. pgstattuple extension dla dokładnych danych. Naprawa: <code>VACUUM VERBOSE tabela</code>. Bez locka: <code>pg_repack</code> extension. Index bloat: <code>REINDEX CONCURRENTLY idx</code>." },
    { q: "Jak zarządzać długimi transakcjami i ich skutkami?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> Długa transakcja blokuje VACUUM (nie może zebrać dead tuples starszych niż jej xmin) → bloat. <code>SELECT pid, age(clock_timestamp(), xact_start), query FROM pg_stat_activity WHERE xact_start IS NOT NULL ORDER BY xact_start</code>. Ustaw <code>idle_in_transaction_session_timeout = '10min'</code>. Lock monitoring: <code>pg_locks JOIN pg_stat_activity</code>." },
    { q: "Co to logical replication i czym różni się od streaming?", a: "Streaming: fizyczna kopia WAL (byte-by-byte) — tylko ta sama wersja PG, standby read-only. Logical: replika zmian per tabelę (INSERT/UPDATE/DELETE zdekodowane) — różne wersje PG, selektywne tabele, standby może zapisywać inne tabele, używane do migracji i pub/sub. <code>CREATE PUBLICATION / SUBSCRIPTION</code>. pglogical, Debezium (CDC)." },
    { q: "Jak działa connection pooling w szczegółach — PgBouncer tryby?", a: "Session pooling: połączenie serwera trzymane przez całą sesję klienta (jak bez poolera). Transaction pooling: połączenie zwalniane po każdej transakcji — najefektywniejsze, ale: prepared statements, SET, advisory locks nie działają bez modyfikacji apki. Statement pooling: per statement — bardzo restrykcyjny. Transaction = standard dla OLTP." },
    { q: "Jak zdiagnozować i rozwiązać deadlock?", a: "<code>SELECT * FROM pg_locks WHERE NOT granted</code>. Logi: <code>log_deadlocks = on</code> — PostgreSQL loguje automatycznie. Deadlock gdy dwa procesy czekają na siebie w kółko — PG wykrywa i rollbackuje jednego. Rozwiązanie: stała kolejność lockowania tabel/wierszy w aplikacji. <code>lock_timeout = '5s'</code> jako zabezpieczenie." },
    { q: "Co to pg_stat_statements i jak używać?", a: "<span class='tip-badge tip-cmd'>CMD</span> Extension do śledzenia statystyk zapytań. <code>CREATE EXTENSION pg_stat_statements;</code>. <code>shared_preload_libraries = 'pg_stat_statements'</code>. Top 10 najwolniejszych: <code>SELECT query, calls, mean_exec_time, total_exec_time FROM pg_stat_statements ORDER BY mean_exec_time DESC LIMIT 10;</code>. Reset: <code>SELECT pg_stat_statements_reset();</code>." },
    { q: "Jak zaimplementować row-level security (RLS)?", a: "<code>ALTER TABLE orders ENABLE ROW LEVEL SECURITY;</code>. Policy: <code>CREATE POLICY user_orders ON orders USING (user_id = current_user_id());</code>. <code>FORCE ROW LEVEL SECURITY</code> — dotyczy też właściciela tabeli. Użycie: multi-tenant SaaS, dane per użytkownik. Performance: indeks na kolumnie policy + <code>SET app.current_user_id = '123'</code>." },
    { q: "Jak działają foreign keys i ich wpływ na wydajność?", a: "FK = constraint + trigger sprawdzający referencję. <span class='tip-badge tip-warn'>WAŻNE</span> Brak indeksu na FK w tabeli zależnej → Seq Scan przy DELETE/UPDATE rodzica (sprawdza czy są dzieci). <code>SELECT conname, conrelid::regclass FROM pg_constraint WHERE contype='f' AND NOT EXISTS (SELECT 1 FROM pg_index WHERE indrelid=conrelid AND indkey[0]=conkey[1])</code> — znajdź FK bez indeksów." },
    { q: "Co to materialized views i kiedy używać?", a: "<code>CREATE MATERIALIZED VIEW mv_stats AS SELECT ... FROM big_table GROUP BY ...;</code>. Refresh: <code>REFRESH MATERIALIZED VIEW CONCURRENTLY mv_stats;</code> — bez blokowania reads. Indeksy na MV możliwe. Używaj gdy: drogie zapytania agregujące, dane mogą być nieaktualne przez chwilę. Nie odświeżają się automatycznie — użyj pg_cron lub trigger." },
    { q: "Jak tunować autovacuum per tabelę?", a: "Globalny autovacuum może być za powolny dla dużych tabel z dużą rotacją. Per tabela: <code>ALTER TABLE orders SET (autovacuum_vacuum_scale_factor = 0.01, autovacuum_vacuum_threshold = 1000, autovacuum_analyze_scale_factor = 0.005);</code>. Monitoruj: <code>pg_stat_user_tables.last_autovacuum</code>. <code>autovacuum_vacuum_cost_delay = 2ms</code> dla szybszego vacuum." }
  ]},

  { title: "SQL — Zapytania i Optymalizacja", cat: "Database", qa: [
    { q: "Co to ACID i jak PostgreSQL to realizuje?", a: "<span class='tip-badge tip-info'>INFO</span> Atomicity (wszystko lub nic — rollback), Consistency (integralność danych), Isolation (transakcje nie widzą wzajemnych zmian — MVCC), Durability (zatwierdzony = trwały — WAL). Poziomy izolacji: READ COMMITTED (domyślny), REPEATABLE READ, SERIALIZABLE." },
    { q: "Typy JOIN — różnice?", a: "INNER JOIN: tylko pasujące wiersze. LEFT JOIN: wszystkie z lewej + pasujące z prawej (NULL gdy brak). RIGHT JOIN: odwrotnie. FULL OUTER JOIN: wszystkie z obu stron. CROSS JOIN: iloczyn kartezjański. SELF JOIN: tabela z samą sobą. <code>NATURAL JOIN</code>: po kolumnach o tej samej nazwie (unikaj)." },
    { q: "Co to CTE (Common Table Expressions)?", a: "<code>WITH aktywni AS (SELECT id, imie FROM uzytkownicy WHERE status='aktywny'), zamowienia AS (SELECT user_id, COUNT(*) cnt FROM orders GROUP BY user_id) SELECT a.imie, z.cnt FROM aktywni a JOIN zamowienia z ON a.id=z.user_id;</code>. Czytelność, reużycie, recursive CTE dla hierarchii." },
    { q: "Co to Window Functions?", a: "<code>SELECT imie, pensja, AVG(pensja) OVER (PARTITION BY dzial) AS avg_dzial, RANK() OVER (ORDER BY pensja DESC) AS ranking FROM pracownicy;</code>. Funkcje: ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD, FIRST_VALUE, LAST_VALUE, SUM/AVG OVER (ROWS BETWEEN ...)." },
    { q: "Różnica GROUP BY vs PARTITION BY?", a: "GROUP BY: agreguje wiersze → mniej wierszy w wyniku. PARTITION BY (window function): oblicza per partycję ale zachowuje wszystkie wiersze. Przykład: GROUP BY zwróci 1 wiersz per dział, PARTITION BY zwróci każdego pracownika z dodanym avg działu." },
    { q: "Jak optymalizować wolne zapytania?", a: "<span class='tip-badge tip-warn'>WAŻNE</span> 1) EXPLAIN ANALYZE — znajdź Seq Scan na dużej tabeli. 2) Dodaj brakujący indeks. 3) Sprawdź statystyki (ANALYZE). 4) Unikaj funkcji na indeksowanych kolumnach w WHERE (<code>WHERE LOWER(email)</code> omija indeks — użyj functional index). 5) Ogranicz SELECT *. 6) Sprawdź N+1 queries." },
    { q: "Co to subquery vs JOIN — kiedy co lepsze?", a: "JOIN często szybszy — planer może wybrać lepszy algorytm. Correlated subquery (wykonuje się per wiersz) = wolna. EXISTS zazwyczaj szybszy niż IN z subquery dla dużych zbiorów. WITH (CTE) w PostgreSQL 12+ może być inlined przez planer. EXPLAIN pokaże różnicę." },
    { q: "Co to indeksy złożone i kiedy używać?", a: "Indeks na wielu kolumnach: <code>CREATE INDEX ON orders(user_id, created_at);</code>. Kolumnność ma znaczenie — indeks użyteczny dla zapytań z prefiksem (user_id, lub user_id + created_at). Covering index: <code>INCLUDE (status)</code> — Index Only Scan bez dostępu do heap." },
    { q: "Co to UPSERT i jak używać?", a: "<code>INSERT INTO users (id, email, updated_at) VALUES (1, 'jan@x.com', NOW()) ON CONFLICT (id) DO UPDATE SET email = EXCLUDED.email, updated_at = EXCLUDED.updated_at;</code>. <code>ON CONFLICT DO NOTHING</code> — ignoruj duplikaty. Wymaga unique constraint lub unique index na kolumnie konfliktu." },
    { q: "Co to partycjonowanie tabel?", a: "Duże tabele dzielone na mniejsze partycje (physical). Typy: RANGE (<code>PARTITION BY RANGE (created_at)</code> — per miesiąc), LIST (per region/status), HASH. Korzyści: szybsze query pruning, szybsze VACUUM, archiwizacja (DROP PARTITION). PostgreSQL 10+ deklaratywne partycjonowanie." },
    { q: "Jak działają transakcje i savepoints?", a: "<code>BEGIN;</code> ... <code>COMMIT;</code> lub <code>ROLLBACK;</code>. Savepoint: <code>SAVEPOINT sp1;</code> ... <code>ROLLBACK TO sp1;</code> — częściowy rollback. DDL w transakcji: PostgreSQL wspiera (<code>CREATE TABLE</code> w BEGIN/COMMIT). <code>SET TRANSACTION ISOLATION LEVEL SERIALIZABLE;</code>." },
    { q: "Co to JSON i JSONB w PostgreSQL?", a: "JSON: przechowuje tekst (zachowuje kolejność, spacje). JSONB: binarny (indeksowalny, szybsze query, bez kolejności kluczy). Operatory: <code>-></code> (JSON object), <code>->></code> (text), <code>#></code> (ścieżka). GIN index: <code>CREATE INDEX ON tabela USING gin(dane jsonb_path_ops);</code>. Funkcje: <code>jsonb_set, jsonb_agg, json_build_object</code>." }
  ]}
];

let activeTag = null;
let searchVal = "";
let answered = {};

function initUI() {
  const allQ = DATA.reduce((a,d)=>a+d.qa.length, 0);
  document.getElementById("hdr-topics").textContent = DATA.length;
  document.getElementById("hdr-questions").textContent = allQ;
  renderTags();
  renderSidebar();
  render();
}

function renderTags() {
  const row = document.getElementById("tag-row");
  const cats = [...new Set(DATA.map(d=>d.cat))];
  row.innerHTML = cats.map(c => {
    const info = CATS[c];
    const isActive = activeTag === c;
    const style = isActive
      ? `background:${info.bg};border-color:${info.color};color:${info.color}`
      : `border-color:${info.border};color:${info.color}`;
    return `<span class="tag" style="${style}" onclick="toggleTag('${c}')">${c}</span>`;
  }).join('');
}

function toggleTag(cat) {
  activeTag = activeTag === cat ? null : cat;
  renderTags();
  renderSidebar();
  render();
}

function clearFilters() {
  activeTag = null;
  document.getElementById("srch").value = "";
  searchVal = "";
  renderTags();
  renderSidebar();
  render();
}

function renderSidebar() {
  const cats = [...new Set(DATA.map(d=>d.cat))];
  let html = '';
  cats.forEach(cat => {
    const items = DATA.filter(d => d.cat === cat);
    const visible = items.filter(d => matchesFilter(d));
    if (!visible.length) return;
    html += `<div class="side-label">${cat}</div>`;
    visible.forEach(d => {
      const info = CATS[d.cat];
      const isActive = activeTag === d.cat;
      html += `<div class="side-item${isActive?' active':''}" onclick="scrollTo('sec_${esc(d.title)}')">
        <div class="side-dot" style="background:${info.color}"></div>
        <span>${d.title}</span>
        <span class="side-count">${d.qa.length}</span>
      </div>`;
    });
  });
  document.getElementById("sidebar").innerHTML = html;
}

function esc(s) { return s.replace(/[^a-z0-9]/gi,'_'); }

function matchesFilter(d) {
  if (activeTag && d.cat !== activeTag) return false;
  if (!searchVal) return true;
  const sv = searchVal.toLowerCase();
  if (d.title.toLowerCase().includes(sv)) return true;
  return d.qa.some(qa => qa.q.toLowerCase().includes(sv) || qa.a.toLowerCase().includes(sv));
}

function filteredQA(d) {
  if (!searchVal) return d.qa;
  const sv = searchVal.toLowerCase();
  if (d.title.toLowerCase().includes(sv)) return d.qa;
  return d.qa.filter(qa => qa.q.toLowerCase().includes(sv) || qa.a.toLowerCase().includes(sv));
}

function render() {
  const items = DATA.filter(matchesFilter);
  const totalQ = items.reduce((a,d) => a + filteredQA(d).length, 0);
  document.getElementById("result-bar").textContent = `${items.length} tematów · ${totalQ} pytań`;

  if (!items.length) {
    document.getElementById("grid").innerHTML = '<div class="no-results">Brak wyników — spróbuj innej frazy lub zresetuj filtry</div>';
    return;
  }

  document.getElementById("grid").innerHTML = items.map(d => {
    const info = CATS[d.cat];
    const id = `sec_${esc(d.title)}`;
    const qa = filteredQA(d);
    return `<div class="section" id="${id}">
      <div class="section-header" onclick="toggleSection('${id}')">
        <div class="sec-dot" style="background:${info.color}"></div>
        <span class="sec-title">${d.title}</span>
        <span class="sec-cat" style="background:${info.bg};border-color:${info.border};color:${info.color}">${d.cat}</span>
        <span class="sec-qcount">${qa.length} pytań</span>
        <span class="chevron">▼</span>
      </div>
      <div class="section-body" id="body_${id}">
        ${qa.map((qa, i) => {
          const qid = `q_${esc(d.title)}_${i}`;
          return `<div class="qa-item">
            <div class="q-row" onclick="toggleAnswer('${qid}')">
              <span class="q-badge">Q${i+1}</span>
              <span class="q-text">${qa.q}</span>
            </div>
            <div class="a-row" id="${qid}">
              <div class="a-text">${qa.a}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function toggleSection(id) {
  const header = document.querySelector(`#${id} .section-header`);
  const body = document.getElementById(`body_${id}`);
  header.classList.toggle('open');
  body.classList.toggle('open');
}

function toggleAnswer(qid) {
  document.getElementById(qid).classList.toggle('open');
}

function scrollTo(id) {
  const el = document.getElementById(id);
  if (el) {
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    const header = el.querySelector('.section-header');
