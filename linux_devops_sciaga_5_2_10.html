    const body = el.querySelector('.section-body');
    if (header && !header.classList.contains('open')) {
      header.classList.add('open');
      body.classList.add('open');
    }
  }
}

document.getElementById("srch").addEventListener("input", e => {
  searchVal = e.target.value.toLowerCase();
  render();
  renderSidebar();
});

document.getElementById("srch").addEventListener("keydown", e => {

});

// ── Tokenizuj zapytanie + rozwiń synonimy ────────────────────────────────────
function expandQuery(raw) {
  const tokens = raw.toLowerCase().trim().split(/\s+/).filter(t => t.length > 1);
  const expanded = new Set(tokens);
  tokens.forEach(t => {
    (SYNONYMS[t] || []).forEach(s => expanded.add(s));
    // częściowe dopasowanie kluczy synonimów
    Object.keys(SYNONYMS).forEach(k => {
      if (k.includes(t) || t.includes(k)) {
        expanded.add(k);
        (SYNONYMS[k] || []).forEach(s => expanded.add(s));
      }
    });
  });
  return { tokens, expanded: [...expanded] };
}

// ── Scoring: ile tokenów/synonimów trafia w Q lub A ─────────────────────────
function scoreItem(qa, sectionTitle, expanded, tokens) {
  const qLow = qa.q.toLowerCase();
  const aLow = qa.a.replace(/<[^>]+>/g,'').toLowerCase();
  const tLow = sectionTitle.toLowerCase();
  let score = 0;

  tokens.forEach(t => {
    if (qLow.includes(t)) score += 6;       // dokładne trafienie w pytanie
    if (tLow.includes(t)) score += 4;       // trafienie w tytuł sekcji
    if (aLow.includes(t)) score += 2;       // trafienie w odpowiedź
  });
  expanded.forEach(t => {
    if (qLow.includes(t)) score += 2;
    if (tLow.includes(t)) score += 2;
    if (aLow.includes(t)) score += 1;
  });
  return score;
}

// ── Podświetl tokeny w tekście ───────────────────────────────────────────────
function highlight(text, tokens) {
  let out = text;
  tokens.filter(t => t.length > 2).forEach(t => {
    const re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
    out = out.replace(re, '<mark>$1</mark>');
  });
  return out;
}

// ── Główna funkcja inteligentnego wyszukiwania ───────────────────────────────
function smartSearch() {
  const raw = document.getElementById("srch").value.trim();
  if (!raw) return;

  const panel = document.getElementById("ai-panel");
  const textEl = document.getElementById("ai-text");
  const btn = document.getElementById("ai-ask-btn");

  panel.classList.add("open");
  textEl.innerHTML = '<span style="color:var(--muted);font-size:.8rem">Szukam...</span>';

  const { tokens, expanded } = expandQuery(raw);

  // Zbierz i posortuj wyniki
  const results = [];
  DATA.forEach(d => {
    d.qa.forEach(qa => {
      const s = scoreItem(qa, d.title, expanded, tokens);
      if (s > 0) results.push({ score: s, qa, section: d.title, cat: d.cat });
    });
  });
  results.sort((a, b) => b.score - a.score);
  const top = results.slice(0, 5);

  if (!top.length) {
    textEl.innerHTML = `<span style="color:var(--muted)">Brak wyników dla <strong>"${raw}"</strong> — spróbuj inaczej lub użyj filtrów kategorii.</span><button class="ai-close" onclick="closeAI()">✕</button>`;
    btn.disabled = false;
    return;
  }

  const catColors = { "System":"#10b981","Security":"#ef4444","Infra/IaC":"#3b82f6","Containers":"#8b5cf6","Cloud":"#f59e0b","Monitoring":"#14b8a6","Networking":"#ec4899","Storage/HA":"#a78bfa","CI/CD":"#f97316","Database":"#06b6d4" };

  const html = top.map((r, i) => {
    const col = catColors[r.cat] || '#8492a6';
    const qHighlighted = highlight(r.qa.q, tokens);
    const aClean = r.qa.a.replace(/<span[^>]*>.*?<\/span>/g,'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
    const aShort = aClean.length > 280 ? aClean.slice(0,280)+'…' : aClean;
    const aHighlighted = highlight(aShort, tokens);
    return `<div class="sr-card" style="--acc:${col}">
      <div class="sr-meta"><span class="sr-num">${i+1}</span><span class="sr-sec">${r.section}</span><span class="sr-cat" style="color:${col};border-color:${col}40">${r.cat}</span></div>
      <div class="sr-q">${qHighlighted}</div>
      <div class="sr-a">${aHighlighted}</div>
    </div>`;
  }).join('');

  const expandedShown = expanded.filter(t => !tokens.includes(t)).slice(0,6);
  const synonymLine = expandedShown.length
    ? `<div class="sr-synonyms">Rozszerzone o: ${expandedShown.map(t=>`<code>${t}</code>`).join(' ')}</div>`
    : '';

  textEl.innerHTML = `
    <div class="sr-header">
      <span>Znaleziono <strong>${results.length}</strong> wyników dla <strong>"${raw}"</strong> — top ${top.length}</span>
      <button class="ai-close" onclick="closeAI()">✕</button>
    </div>
    ${synonymLine}
    ${html}
  `;
}

function askAI() { smartSearch(); }

function searchGoogle() {
  const raw = document.getElementById("srch").value.trim();
  if (!raw) { document.getElementById("srch").focus(); return; }
  window.open("https://www.google.com/search?q=" + encodeURIComponent(raw), "_blank");
}

async function askClaude() {
  const raw = document.getElementById("srch").value.trim();
  if (!raw) { document.getElementById("srch").focus(); return; }

  const panel = document.getElementById("ai-panel");
  const textEl = document.getElementById("ai-text");
  const btn = document.getElementById("ai-claude-btn");

  panel.classList.add("open");
  btn.disabled = true;
  textEl.innerHTML = `<span style="color:var(--muted);font-size:.8rem">⏳ Claude odpowiada...</span>`;

  // Build context from DATA
  const context = DATA.map(d =>
    d.title + ":\n" + d.qa.map(qa => "Q: " + qa.q + "\nA: " + qa.a.replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim()).join("\n")
  ).join("\n\n");

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: "Jesteś pomocnym asystentem DevOps/Linux. Odpowiadaj po polsku, zwięźle i konkretnie. Używaj <code> dla komend. Bazuj głównie na dostarczonej ściądze, ale możesz uzupełniać wiedzą własną.\n\nŚCIĄGA:\n" + context,
        messages: [{ role: "user", content: raw }]
      })
    });

    const data = await response.json();

    if (data.error) {
      textEl.innerHTML = `<div style="color:#ef4444;font-size:.85rem">⚠️ Błąd API: ${data.error.message}</div><button class="ai-close" onclick="closeAI()">✕</button>`;
      btn.disabled = false;
      return;
    }

    const answer = data.content[0].text;

    // Convert markdown-like to HTML
    const html = answer
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/^### (.+)$/gm, "<h4 style='margin:.5em 0 .2em;color:var(--accent)'>$1</h4>")
      .replace(/^## (.+)$/gm, "<h3 style='margin:.5em 0 .2em;color:var(--accent)'>$1</h3>")
      .replace(/^- (.+)$/gm, "<li>$1</li>")
      .replace(/(<li>.*<\/li>)/gs, "<ul style='margin:.3em 0 .3em 1.2em;padding:0'>$1</ul>")
      .replace(/\n\n/g, "<br><br>")
      .replace(/\n/g, "<br>");

    textEl.innerHTML = `
      <div class="sr-header">
        <span>✦ <strong>Claude AI</strong> odpowiada na: <strong>"${raw}"</strong></span>
        <button class="ai-close" onclick="closeAI()">✕</button>
      </div>
      <div style="font-size:.85rem;line-height:1.6;padding:.5rem 0">${html}</div>
    `;
  } catch (err) {
    textEl.innerHTML = `<div style="color:#ef4444;font-size:.85rem">⚠️ Błąd połączenia: ${err.message}</div><button class="ai-close" onclick="closeAI()">✕</button>`;
  }

  btn.disabled = false;
}

function formatAIResponse(text) {
  return text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/^### (.+)$/gm, "<strong style='font-size:.85rem;color:#a78bfa'>$1</strong>")
    .replace(/^## (.+)$/gm, "<strong style='font-size:.88rem;color:#8b5cf6'>$1</strong>")
    .replace(/^# (.+)$/gm, "<strong style='font-size:.9rem;color:#8b5cf6'>$1</strong>")
    .replace(/\n\n/g, "<br><br>").replace(/\n/g, "<br>");
}

function closeAI() {
  document.getElementById("ai-panel").classList.remove("open");
  document.getElementById("ai-text").innerHTML = "";
}

initUI();
</script>
